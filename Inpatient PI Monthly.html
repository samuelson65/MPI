<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: outline rail | editor | sticky email preview. Rail hides under 1240px; tabs under 900px. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --fg:#1b2531; --muted:#5d6876; --line:#dbe0e6; --soft:#f4f6f8;
  --accent:#b06d1f; --accent-soft:#f7ecdd; --ink:#17345a; --off:#a3acb7;
  --ip:#24569a; --ip-soft:#e3ecf8; --op:#23745c; --op-soft:#dff0e9;
  --good:#2b7a4b; --good-soft:#e2f1e7; --warn:#9a6206; --warn-soft:#fbefd6; --bad:#b03a3a; --bad-soft:#f8e0e0;
  --display:"Source Serif 4", Georgia, serif;
  --ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --panel:#19202a; --fg:#e3e8ee; --muted:#98a3b0; --line:#2b3440; --soft:#202833;
  --accent:#e2a25a; --accent-soft:#3a2b1a; --ink:#a6c6ea; --off:#56606c;
  --ip:#7fb0ef; --ip-soft:#1c2b40; --op:#6fcfaf; --op-soft:#17322a;
  --good:#6cc28f; --good-soft:#1d3427; --warn:#e2ad4c; --warn-soft:#3a2f17; --bad:#ec8585; --bad-soft:#3d2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#19202a; --fg:#e3e8ee; --muted:#98a3b0; --line:#2b3440; --soft:#202833;
  --accent:#e2a25a; --accent-soft:#3a2b1a; --ink:#a6c6ea; --off:#56606c;
  --ip:#7fb0ef; --ip-soft:#1c2b40; --op:#6fcfaf; --op-soft:#17322a;
  --good:#6cc28f; --good-soft:#1d3427; --warn:#e2ad4c; --warn-soft:#3a2f17; --bad:#ec8585; --bad-soft:#3d2224; color-scheme:dark}
.prog-ip{--prog:var(--ip);--prog-soft:var(--ip-soft)}
.prog-op{--prog:var(--op);--prog-soft:var(--op-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
svg{flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--prog)}
.top-in{max-width:1560px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.pill{font:600 11px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--prog);background:var(--prog-soft);padding:4px 9px;border-radius:12px;flex:none}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--display);font-size:18px;font-weight:600;color:var(--fg);white-space:nowrap}
.brand-t span{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.edition{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.edition select{width:auto;padding:6px 8px;font-size:13px}
button{font:inherit;font-size:13px;font-weight:500;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--prog);border-color:var(--prog);color:var(--panel)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--prog);outline-offset:2px}
.chk{font-size:12.5px;padding:6px 11px;border-radius:14px}

.chk.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chk.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tabs{display:none;gap:4px;width:100%}

.wrap{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.05fr);gap:22px;
  padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* rail */
.rail{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.rail h3{font:600 11px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
.rail h3:first-child{margin-top:0}

.rail button:hover{background:var(--panel)}
.rail button span.n{font-family:var(--mono);font-size:11px;color:var(--muted);width:18px;flex:none}
.rail button span.l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dot.Ready{background:var(--warn)} .dot.Approved{background:var(--good)}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
label.cbx{display:inline-flex;flex-direction:row;align-items:center;gap:7px;font-size:13px;color:var(--fg);font-weight:400}
label.cbx input{width:auto;accent-color:var(--prog)}
.flagrow{display:flex;flex-wrap:wrap;gap:6px 18px}
input,textarea,select{font:inherit;font-size:14px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.x{padding:3px 8px;font-size:12px}
.add{align-self:flex-start;border-style:dashed}
.paste{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{padding:6px 10px 6px 6px}

.sw[aria-pressed="true"]{border-color:var(--prog);background:var(--prog-soft)}
.suggest{border:1px solid var(--prog);background:var(--prog-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.suggest p{margin:0}
/* KPI rows */
.krow{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.krow-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px}
.krow-h .kx{flex:1;min-width:0;border:0;background:none;padding:4px 0;justify-content:flex-start;text-align:left;display:flex;gap:10px;align-items:center}
.krow-h .kx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.krow-h .kx small{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;margin-left:auto}
.sdot{width:9px;height:9px;border-radius:5px;flex:none;background:var(--off)}
.sdot.ok{background:var(--good)} .sdot.warn{background:var(--warn)} .sdot.bad{background:var(--bad)}
.krow-b{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.krow-b input,.krow-b select,.krow-b textarea{background:var(--panel)}
/* chart type picker */
.ctypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ctype{flex-direction:column;gap:4px;padding:9px 6px 7px;font-size:11.5px;justify-content:center;color:var(--muted)}
.ctype svg{color:var(--muted)}
.ctype[aria-pressed="true"]{border-color:var(--prog);background:var(--prog-soft);color:var(--prog)}
.ctype[aria-pressed="true"] svg{color:var(--prog)}
/* checks */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 10px;border-radius:7px;min-width:0}
.checks li b{flex:none;font-family:var(--mono);font-size:11px;padding-top:2px}
.checks li span{min-width:0;overflow-wrap:anywhere}
.checks .ok{background:var(--good-soft);color:var(--good)}
.checks .warn{background:var(--warn-soft);color:var(--fg)} .checks .warn b{color:var(--warn)}
.checks .bad{background:var(--bad-soft);color:var(--fg)} .checks .bad b{color:var(--bad)}
/* section cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:90px;transition:box-shadow .15s}
.card.open{box-shadow:0 0 0 2px var(--prog-soft)}
.card.off{opacity:.62}
.card.off .ch{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--soft) 8px 16px)}
.card.dropto{box-shadow:0 -3px 0 var(--prog)}
.card.dragging{opacity:.4}
.ch{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px}
.grip{cursor:grab;color:var(--off);padding:4px 2px;display:flex}
.grip:active{cursor:grabbing}
.tic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--prog-soft);color:var(--prog);flex:none;position:relative}
.tic i{position:absolute;right:-4px;bottom:-4px;font:500 10px var(--mono);font-style:normal;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:0 3px;line-height:14px}
.card.off .tic{background:var(--soft);color:var(--off)}
.expand{flex:1;min-width:0;text-align:left;border:0;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.expand b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.expand span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:400}
.st{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:9px;flex:none}
.st.Draft{background:var(--soft);color:var(--muted)}
.st.Ready{background:var(--warn-soft);color:var(--warn)}
.st.Approved{background:var(--good-soft);color:var(--good)}
.tools{display:flex;gap:4px;align-items:center;flex:none}
.ic{padding:4px 7px;font-size:13px;line-height:1}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--off);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--prog)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--prog);outline-offset:2px}
.cb{padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.flags{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 10px}
.flags select{width:auto}
.delbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar select,.addbar input{flex:1 1 180px;width:auto}
.confirm{background:var(--prog-soft);border:1px solid var(--prog);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1 1 260px}
.lst{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.lr b{flex:1 1 140px;min-width:0;font-weight:500}
.lr small{color:var(--muted);font-size:12px}
.empty{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.mx{overflow-x:auto}
.mx table{border-collapse:collapse;font-size:13px;min-width:100%}
.mx th{font-size:11px;color:var(--muted);text-align:left;font-weight:500;padding:4px}
.mx th .thw{display:flex;gap:3px;align-items:center}
.mx td{padding:3px 4px;vertical-align:top}
.mx td input,.mx th input{min-width:70px;padding:5px 7px;font-size:13px}
.mx .pair{display:flex;gap:4px}
.backup textarea{font-family:var(--mono);font-size:12px;min-height:80px}
@media (max-width:1239px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.rail{display:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .preview{position:static;max-height:none;overflow:visible}

  body[data-view="preview"] .editor{display:none}
  .pvbar .seg{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">

</main>
<div class="toast" id="toast" hidden></div>

<script>
const PROGRAM='inpatient';const IS_IP=PROGRAM==='inpatient';const PNAME=IS_IP?'Inpatient':'Outpatient';
document.body.classList.add(IS_IP?'prog-ip':'prog-op');
document.getElementById('progPill').textContent=PNAME;
document.getElementById('appName').textContent='Newsletter builder';
const KEY=`pi-${PROGRAM}-draft-v1`,ARCH=`pi-${PROGRAM}-archive-v1`,TPL=`pi-${PROGRAM}-layouts-v1`,UIKEY=`pi-${PROGRAM}-ui-v1`;
const THEMES={
  harbor:{name:'Harbor',dark:'#14304f',accent:'#c7822b',soft:'#fbf1e3',tint:'#eef2f7',mid:'#9fb3c8',pal:['#14304f','#c7822b','#7d9bbb','#4f7aa6','#e3b36f','#b7c4d1']},
  evergreen:{name:'Evergreen',dark:'#15392f',accent:'#c49a2c',soft:'#f8f1dc',tint:'#edf3f0',mid:'#9dbbb0',pal:['#15392f','#c49a2c','#6f9a8a','#3f7a66','#e0c46e','#b4ccc3']},
  graphite:{name:'Graphite',dark:'#23272e',accent:'#1c8c8a',soft:'#e1f2f1',tint:'#f0f2f4',mid:'#aab2bc',pal:['#23272e','#1c8c8a','#7a8490','#5b6573','#7cc4c2','#c3c9d0']},
  claret:{name:'Claret',dark:'#4a1d2b',accent:'#c28650',soft:'#f7ebe0',tint:'#f6eff1',mid:'#c3a5ae',pal:['#4a1d2b','#c28650','#9a6a78','#8a3f55','#e2b48a','#d6c3c9']}
};
const UNITS=[['%','%'],['$','$'],['$K','$K'],['$M','$M'],['#','Count'],['days','Days']];
const DIRS=['Higher is better','Lower is better'];
const DECS=[['0','0 decimals'],['1','1 decimal'],['2','2 decimals']];
const STYLES=[['bar','Number + bar to target'],['bullet','Bullet with zones'],['trend','Number + 6-month trend'],['number','Big number only']];
const SORTS=[['none','As entered'],['desc','High to low'],['asc','Low to high']];
const HIS=[['top1','Highest'],['top3','Top 3'],['bottom1','Lowest'],['last','Last row'],['none','None']];
const SCALES=[['theme','Theme colour'],['red','Red = high'],['green','Green = high']];
const LIB_COMMON=[['Productivity vs plan','%',0,1],['$ identified','$M',1,1],['$ recovered','$M',1,1],['Recovery rate','%',0,1],['Avg $ per finding','$',0,1],['Claims reviewed','#',0,1],['Turnaround','days',0,0],['Appeal overturn rate','%',0,0]];
const LIB_IP=[['DRG hit rate','%',1,1],['Clinical validation findings','#',0,1],['MCC/CC removal rate','%',1,1],['Short-stay (2-midnight) findings','#',0,1],['Readmission findings','#',0,1],['High-cost outlier reviews','#',0,1]];
const LIB_OP=[['Hit rate','%',1,1],['E&M level 4–5 share','%',1,0],['Modifier 25/59 findings','#',0,1],['Units-per-claim outliers','#',0,1],['NCCI unbundling findings','#',0,1],['Provider outliers flagged','#',0,1]];
const LIB=[...(IS_IP?LIB_IP:LIB_OP),...LIB_COMMON].map(([label,unit,dec,up])=>({label,unit,dec:String(dec),dir:up?DIRS[0]:DIRS[1]}));
const kpi=(o={})=>({label:'',actual:'',target:'',prev:'',unit:'%',dec:'1',dir:DIRS[0],style:'bar',trend:true,showDelta:true,showTarget:true,note:'',...o});

const CT={
  hbar:{name:'Ranked bars',hint:'Compares categories with horizontal bars. Uses the first series.',min:1,max:1},

function fmt(v,u,dec){if(v===null||v===undefined||isNaN(v))return '–';const d=dec===undefined||dec===''?1:+dec;const n=v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d});
  return u==='%'?n+'%':u==='$M'?'$'+n+'M':u==='$K'?'$'+n+'K':u==='$'?'$'+n:u==='days'?n+(Math.abs(v)===1?' day':' days'):n}
const fmtDelta=(d,u,dec)=>u==='%'?Math.abs(d).toFixed(Math.min(1,+dec||0)===0&&Number.isInteger(d)?0:1)+' pts':fmt(Math.abs(d),u,dec);

function mix(a,b,p){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('')}

function setCType(d,ct){d.ctype=ct;const c=CT[ct];const names={compare:['Last month','This month'],bullet:['Actual','Target']}[ct];

function card(s,i,n,shown){

  const sub=[s.type==='chart'?CT[s.data.ctype].name:T.name,s.exec?'Exec':'',s.clientSafe?'Client':'',s.on&&!shown?'not in this edition':''].filter(Boolean).join(' · ');

   <div class="ch"><span class="grip" draggable="true" data-grip="${i}" title="Drag to reorder">${svg(GRIP,16,true)}</span>

   ${s.title?`<div style="font:600 22px/1.25 ${SERIF};color:${t.dark};margin-top:3px">${s.type==='watch'&&s.data.link?`<a href="${esc(s.data.link)}" style="color:${t.dark};text-decoration:underline">${esc(s.title)}</a>`:esc(s.title)}</div>`:''}</td></tr></table>

const insightBlock=(txt,t)=>txt?`<div style="border-left:4px solid ${t.accent};padding:2px 0 2px 14px;margin:0 0 18px;font:italic 17px/1.5 ${SERIF};color:${t.dark}">${nl(txt)}</div>`:'';
function trendPts(label,cur){const pts=(RS.history||[]).map(h=>({m:h.month,v:num(h.kpis?.[label])})).filter(x=>x.v!==null).slice(-5);if(cur!==null)pts.push({m:RS.month,v:cur});return pts}
function trendBars(label,cur,t,H=24,labels=false){
  const pts=trendPts(label,cur);if(pts.length<3)return '';

  return `<table role="presentation" cellpadding="0" cellspacing="0" style="margin:10px 0 0"><tr>${pts.map((p,i)=>{const h=Math.round(H*.22+(p.v-mn)/rng*H*.78);

    ${labels?'':`<td valign="bottom" style="padding-left:6px;font:11px ${SANS};color:${MU}">${pts.length}-month trend</td>`}</tr>
    ${labels?`<tr>${pts.map(p=>`<td style="padding:3px 3px 0 0;font:10px ${SANS};color:${MU};text-align:center">${esc(String(p.m).slice(0,3))}</td>`).join('')}</tr>`:''}</table>`}

function kpiCard(m,t){
  const a=num(m.actual),tg=num(m.target),p=num(m.prev);const st=status(a,tg,m.dir);const lower=m.dir==='Lower is better';
  const d2=a!==null&&p!==null?a-p:null;const good=d2!==null&&(lower?d2<=0:d2>=0);
  const delta=m.showDelta&&d2!==null&&d2!==0?`<span style="font:bold 11px ${SANS};color:${good?ST.ok.c:ST.bad.c};background:${good?ST.ok.bg:ST.bad.bg};border-radius:9px;padding:2px 7px;white-space:nowrap">${d2>0?'▲':'▼'} ${fmtDelta(d2,m.unit,m.dec)}</span>`:'';
  const tgtTxt=m.showTarget&&tg!==null?`Target ${fmt(tg,m.unit,m.dec)}${lower?' (lower is better)':''}`:'';
  const meta=(tgtTxt||delta)?`<div style="font:12px/1.6 ${SANS};color:${MU}">${tgtTxt} ${delta}</div>`:'';
  let vis='';
  if(m.style==='bar'&&tg){const r=ratioOf(a,tg,m.dir)||0;const fill=Math.round(Math.min(r,1.25)/1.25*100);
    vis=`<div style="position:relative;height:6px;background:#ffffff;border-radius:3px;margin:0 0 8px"><div style="width:${fill}%;height:6px;background:${ST[st].c};border-radius:3px;font-size:0">&nbsp;</div><div style="position:absolute;left:80%;top:-3px;width:2px;height:12px;background:${t.dark}"></div></div>`}
  if(m.style==='bullet'&&tg&&a!==null){const cut=amberCut();const max=Math.max(a,tg/(lower?1:1),lower?tg*(1/cut)*1.05:tg)*1.15;const w=v=>Math.max(0,Math.min(100,Math.round(v/max*100)));
    const zones=lower?[[w(tg),ST.ok.bg],[w(tg/cut)-w(tg),ST.warn.bg],[100-w(tg/cut),ST.bad.bg]]:[[w(tg*cut),ST.bad.bg],[w(tg)-w(tg*cut),ST.warn.bg],[100-w(tg),ST.ok.bg]];
    vis=`<div style="position:relative;margin:0 0 8px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>${zones.filter(z=>z[0]>0).map(z=>`<td width="${z[0]}%" style="background:${z[1]};height:16px;font-size:0;line-height:0">&nbsp;</td>`).join('')}</tr></table>
      <div style="position:absolute;left:0;top:5px;width:${w(a)}%;height:6px;background:${t.dark};border-radius:1px"></div><div style="position:absolute;left:${w(tg)}%;top:-2px;width:2px;height:20px;background:${t.accent}"></div></div>`}
  const tr=m.style==='trend'?trendBars(m.label,a,t,40,true):(m.trend&&m.style!=='number'?trendBars(m.label,a,t):'');
  return `<div style="background:${t.tint};border-radius:8px;padding:14px 14px 12px;border-top:3px solid ${st==='none'?t.accent:ST[st].c}">
    <div style="font:bold 10.5px ${SANS};letter-spacing:.8px;text-transform:uppercase;color:${MU}">${esc(m.label)}</div>
    <div style="font:600 ${m.style==='number'?36:30}px/1.1 ${SERIF};color:${t.dark};margin:8px 0 10px">${fmt(a,m.unit,m.dec)}</div>
    ${vis}${meta}${m.note?`<div style="font:12.5px/1.45 ${SANS};color:${FG};margin-top:8px">${esc(m.note)}</div>`:''}${tr}</div>`}

function chartRows(d){const k=Math.min(CT[d.ctype].max,d.series.length);
  let rows=d.rows.filter(r=>r.label).map(r=>({label:r.label,v:Array.from({length:k},(_,j)=>num(r.v[j]))}));
  if(d.sort==='desc')rows.sort((a,b)=>(b.v[0]??-1e18)-(a.v[0]??-1e18));else if(d.sort==='asc')rows.sort((a,b)=>(a.v[0]??1e18)-(b.v[0]??1e18));
  return {rows:rows.slice(0,Math.max(1,num(d.maxRows)||12)),k}}
function hiSet(rows,h){const idx=rows.map((r,i)=>[r.v[0],i]).filter(x=>x[0]!==null);
  if(h==='top1'||h==='top3'){idx.sort((a,b)=>b[0]-a[0]);return new Set(idx.slice(0,h==='top1'?1:3).map(x=>x[1]))}
  if(h==='bottom1'){idx.sort((a,b)=>a[0]-b[0]);return new Set(idx.slice(0,1).map(x=>x[1]))}
  if(h==='last')return new Set([rows.length-1]);return new Set()}
const legend=(names,colors)=>`<table role="presentation" cellpadding="0" cellspacing="0" style="margin:10px 0 0"><tr>${names.map((n,j)=>`<td style="padding:0 14px 0 0;font:12px ${SANS};color:${MU};white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${colors[j]};vertical-align:-1px;margin-right:5px"></span>${esc(n)}</td>`).join('')}</tr></table>`;

    const cells=rows.map((r,i)=>{const bars=r.v.map((v,j)=>{const h=v===null?0:Math.max(2,Math.round(v/mx*H));const hl=k===1&&hs.has(i);const col=k===1?(hl?t.accent:t.mid):t.pal[j];

      return `<td valign="bottom" width="${w}%" style="padding:0 3px;height:${H+20}px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr>${bars}</tr></table></td>`}).join('');
    return `<table ${TBL}><tr>${cells}</tr><tr>${rows.map((r,i)=>`<td align="center" style="padding:6px 2px 0;border-top:1px solid ${LN};font:12px ${SANS};color:${k===1&&hs.has(i)?t.accent:MU};${k===1&&hs.has(i)?'font-weight:bold':''}">${esc(r.label)}</td>`).join('')}</tr></table>`+(k>1&&d.showLegend?legend(d.series.slice(0,k),t.pal):'')},
  compare:(d,t)=>{const {rows}=chartRows(d);const mx=Math.max(1e-9,...rows.flatMap(r=>r.v).filter(v=>v!==null));const cols=[t.mid,t.dark];
    const bar=(v,c)=>{const w=Math.max(2,Math.round((v||0)/mx*100));return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:2px 0"><tr><td width="${w}%" style="background:${c};height:10px;border-radius:2px;font-size:0;line-height:0">&nbsp;</td><td style="padding-left:6px;font:11px ${SANS};color:${MU};white-space:nowrap">${d.showValues?fmt(v,d.unit,d.dec):''}</td></tr></table>`};

  share:(d,t)=>{const {rows}=chartRows(d);const tot=rows.reduce((s,r)=>s+(r.v[0]||0),0);if(!tot)return P('Add values to see the share bar.');
    const pal=t.pal;let used=0;const cells=rows.map((r,i)=>{let w=Math.round((r.v[0]||0)/tot*100);if(i===rows.length-1)w=Math.max(0,100-used);used+=w;

    return `<table ${TBL}><tr>${cells}</tr></table><table ${TBL} style="margin-top:12px;border-collapse:collapse">${rows.map((r,i)=>`<tr>

  bullet:(d,t)=>{const {rows}=chartRows(d);const mx=Math.max(1e-9,...rows.flatMap(r=>r.v).filter(v=>v!==null))*1.12;const dir=d.lowerBetter?DIRS[1]:DIRS[0];
    return `<table ${TBL}>${rows.map(r=>{const [a,tg]=r.v;const st=status(a,tg,dir);const aw=Math.max(1,Math.round((a||0)/mx*100)),tw=Math.round((tg||0)/mx*100);

       <td style="padding:8px 0 8px 10px;text-align:right;white-space:nowrap;font:13px ${SANS};color:${MU}">${d.showValues?`<b style="color:${ST[st].c}">${fmt(a,d.unit,d.dec)}</b> of ${fmt(tg,d.unit,d.dec)}`:''}</td></tr>`}).join('')}</table>

  heat:(d,t)=>{const {rows,k}=chartRows(d);const all=rows.flatMap(r=>r.v).filter(v=>v!==null);const mn=Math.min(...all),mx=Math.max(...all),rng=(mx-mn)||1;

/* ---------- checks ---------- */
const PHI=[
  [/\b\d{3}-\d{2}-\d{4}\b/,'an SSN-like number'],
  [/\b\d{10}\b/,'a 10-digit number (NPI or phone?)'],
  [/\b[A-Za-z]{1,4}\d{6,}\b|\b\d{11,}\b/,'a long ID (member, claim or account number?)'],
  [/\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/,'a full date (date of birth or service?)'],
  [/[\w.+-]+@[\w-]+\.[\w.]+/,'an email address'],
  [/\(?\b\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/,'a phone number'],
  [/\b(Dr|Mr|Mrs|Ms)\.?\s+[A-Z][a-z]+/,'a personal or provider name'],
  [/\b(MRN|DOB|SSN|member id|patient name)\b/i,'a PHI keyword']
];
function strings(o,out=[]){if(typeof o==='string')out.push(o);else if(o&&typeof o==='object')Object.values(o).forEach(v=>strings(v,out));return out}
const HAS={kpis:d=>d.items.some(m=>m.actual),chart:d=>d.rows.some(r=>r.label&&r.v.some(x=>x!==''&&x!=null)),ytd:d=>d.ytd,clients:d=>d.clients.some(c=>c.values.some(v=>v.actual)),
  opportunity:d=>d.value||d.text,pipeline:d=>d.stages.some(s=>s.value),initiatives:d=>d.items.some(i=>i.name),watch:d=>d.title||d.rows.some(r=>r.text),
  story:d=>d.steps.some(s=>s.text),asks:d=>d.items.some(a=>a.text),text:d=>d.body};
function runChecks(words){
  const out=[];const vis=visible();const nm=s=>s.title||s.kicker||TYPES[s.type].name;
  if(!S.headline.trim()&&edInfo().kind!=='client')out.push(['bad','The headline is empty. Execs often read only this line.']);
  if(!S.asOf.trim())out.push(['warn','Add a “Data as of” date.']);
  else{const dt=Date.parse(S.asOf);if(!isNaN(dt)&&(Date.now()-dt)/864e5>45)out.push(['warn',`“Data as of” (${S.asOf}) is more than 45 days old.`])}
  vis.forEach(s=>{const d=s.data;
    if(!HAS[s.type](d))out.push(['bad',`${nm(s)} is switched on but has no content.`]);
    if(s.type==='kpis'){const miss=d.items.filter(m=>m.label&&(!m.actual||(!m.target&&m.style!=='number'))).map(m=>m.label);if(miss.length)out.push(['warn',`${nm(s)}: missing actual or target for ${miss.join(', ')}.`])}
    if(s.type==='clients'){let c=0;d.clients.forEach(cl=>cl.values.forEach(v=>{if(!v.actual||!v.target)c++}));if(c)out.push(['warn',`${nm(s)}: ${c} client cell${c>1?'s are':' is'} missing an actual or target.`])}
    if(s.type==='chart'){const {rows}=chartRows(d);const gaps=rows.filter(r=>r.v.some(v=>v===null)).length;if(gaps)out.push(['warn',`${nm(s)}: ${gaps} row${gaps>1?'s have':' has'} empty values.`])}
    if(s.type==='ytd'&&(!d.annual||!d.months))out.push(['warn',`${nm(s)}: add the annual target and months elapsed.`]);
  });
  const notAp=vis.filter(s=>s.status!=='Approved');
  if(notAp.length)out.push(['warn',`${notAp.length} section${notAp.length>1?'s':''} not approved yet: ${notAp.map(nm).join(', ')}.`]);
  const phi=[];
  [['Headline',[S.headline,S.title]],...vis.map(s=>[nm(s),strings([s.title,s.data])])].forEach(([where,txts])=>{
    txts.forEach(tx=>PHI.forEach(([re,label])=>{const m=String(tx).match(re);if(m&&!phi.some(p=>p.where===where&&p.label===label))phi.push({where,label,hit:m[0]})}))});
  phi.forEach(p=>out.push(['bad',`Possible PHI in ${p.where}: ${p.label} (“${p.hit}”). Remove or mask it before sending.`]));
  const mins=Math.max(1,Math.round(words/220));
  if(mins>5)out.push(['warn',`About ${mins} minutes to read. Aim for 5 or less: hide or trim a section.`]);
  return {out,mins};
}

/* ---------- headline draft ---------- */
function draftHeadline(){
  const vis=visible();const bits=[];
  const sc=vis.find(s=>s.type==='kpis');
  if(sc){const ms=sc.data.items.filter(m=>num(m.actual)!==null&&num(m.target)!==null).slice(0,2);
    const p=ms.map(m=>{const r=ratioOf(num(m.actual),num(m.target),m.dir);return `${m.label} at ${fmt(num(m.actual),m.unit,m.dec)}${r!==null?` (${pct(r)} of target)`:''}`});
    if(p.length)bits.push(p.join(' and ')+'.')}
  const y=vis.find(s=>s.type==='ytd');
  if(y){const d=y.data;const Y=num(d.ytd),A=num(d.annual),M=num(d.months);if(Y!==null&&A&&M)bits.push(`Year to date we're on pace for ${fmt(Y/M*12,d.unit)} against a ${fmt(A,d.unit)} target.`)}
  const c=vis.find(s=>s.type==='clients');
  if(c){let ok=0,tot=0;c.data.clients.forEach(cl=>c.data.metrics.forEach((m,j)=>{const v=cl.values[j]||{};const st=status(num(v.actual),num(v.target),m.dir);if(st!=='none'){tot++;if(st==='ok')ok++}}));if(tot)bits.push(`${ok} of ${tot} client targets met.`)}
  const o=vis.find(s=>s.type==='opportunity');
  if(o&&o.data.value)bits.push(`Biggest opportunity: ${o.data.value}${o.data.text?', '+o.data.text.charAt(0).toLowerCase()+o.data.text.slice(1).replace(/\.$/,'')+'.':'.'}`);
  return bits.join(' ')||'Add numbers to the KPI, year-to-date or client sections first.';
}

/* ---------- paste / export ---------- */
function parseGrid(txt){const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());const tab=lines.some(l=>l.includes('\t'));return lines.map(l=>l.split(tab?'\t':',').map(c=>c.trim()))}
const isNumCell=c=>num(c)!==null&&/\d/.test(c);
const clean=c=>(c||'').replace(/[^0-9.\-]/g,'');
function importGrid(kind,b,txt){
  const rows=parseGrid(txt);if(!rows.length)return 'Nothing to import. Copy cells in Excel and paste them in the box first.';
  const d=get(b);
  if(kind==='clients'){
    let header=null;if(rows[0].slice(1).every(c=>!isNumCell(c)))header=rows.shift();
    const k=Math.floor(((header||rows[0]||[]).length-1)/2);if(k<1||!rows.length)return 'Each row needs a client name plus actual and target columns.';
    const ms=[];for(let j=0;j<k;j++){const old=d.metrics[j]||{unit:'%',dir:DIRS[0]};const lab=header?header[1+2*j].replace(/\s*[-–(]?\s*(actual|act|target|tgt)\)?\s*$/i,'').trim():'';ms.push({label:lab||old.label||'KPI '+(j+1),unit:old.unit,dir:old.dir})}
    d.metrics=ms;d.clients=rows.map(r=>({name:r[0]||'',values:ms.map((_,j)=>({actual:clean(r[1+2*j]),target:clean(r[2+2*j])}))}));
    return `Imported ${d.clients.length} client${d.clients.length>1?'s':''} × ${k} KPI${k>1?'s':''}.`}
  if(kind==='chart'){
    let header=null;if(rows[0].length>1&&rows[0].slice(1).every(c=>!isNumCell(c)))header=rows.shift();
    const k=Math.max(1,Math.min(6,(header||rows[0]||[]).length-1));if(!rows.length)return 'Add at least one data row under the header.';
    const names=Array.from({length:k},(_,j)=>(header&&header[1+j])||d.series[j]||'Series '+(j+1));
    d.series=names;d.rows=rows.filter(r=>r[0]).map(r=>({label:r[0],v:Array.from({length:k},(_,j)=>clean(r[1+j]))}));
    setCType(d,d.ctype);const shown=Math.min(k,CT[d.ctype].max);
    return `Imported ${d.rows.length} row${d.rows.length>1?'s':''} × ${k} series${shown<k?` (${CT[d.ctype].name} shows ${shown}; switch to Heat table or Table to see all)`:''}.`}
}
function exportGrid(kind,b){const d=get(b);
  if(kind==='clients')return [['Client',...d.metrics.flatMap(m=>[m.label+' actual',m.label+' target'])].join('\t'),...d.clients.map(c=>[c.name,...d.metrics.flatMap((_,j)=>[c.values[j]?.actual||'',c.values[j]?.target||''])].join('\t'))].join('\n');
  return [['Label',...d.series].join('\t'),...d.rows.map(r=>[r.label,...d.series.map((_,j)=>r.v[j]||'')].join('\t'))].join('\n')}

function applyLayout(entries){const used=new Set();
  S.sections=entries.map(en=>{const ex=S.sections.find(s=>s.type===en.type&&!used.has(s.id));if(ex){used.add(ex.id);return ex}
    return en.full?{...structuredClone(en.full),id:nid()}:sec(en.type)})}

  clearTimeout(saveT);saveT=setTimeout(()=>{document.getElementById('saved').textContent=store.set(KEY,S)?'Draft saved in this browser':'Draft not saved (browser storage is off)'},300);

function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2800)}
const splitIdx=p=>{const k=p.split('.');const i=+k.pop();return [k.join('.'),i]};
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}
const goTo=id=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})};

ed.addEventListener('input',e=>{const el=e.target;const p=el.dataset.p;
  if(p){set(p,el.value);
    if(/^sections\.\d+\.(title|kicker)$/.test(p)){const s=get(p.split('.').slice(0,2).join('.'));const h=document.getElementById('h-'+s.id);if(h)h.textContent=s.title||s.kicker||TYPES[s.type].name;renderRail()}
    if(/clients\.\d+\.name$/.test(p))updateEditionSel();
    refresh()}
  else if(el.dataset.bool){set(el.dataset.bool,el.checked);/\.(exec|clientSafe)$/.test(el.dataset.bool)?rerender():refresh()}
  else if(el.dataset.on!==undefined){S.sections[+el.dataset.on].on=el.checked;rerender()}});
ed.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.p){set(el.dataset.p,el.value);/^sections\.\d+\.status$/.test(el.dataset.p)?rerender():refresh()}});
function onClick(e){
  const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.go){if(D.goopen){openIds.add(D.goopen);renderEditor();refresh()}document.body.dataset.view='edit';setTabs();goTo(D.go);return}
  if(D.open){openIds.has(D.open)?openIds.delete(D.open):openIds.add(D.open);renderEditor();refresh()}
  else if(D.kopen){openK.has(D.kopen)?openK.delete(D.kopen):openK.add(D.kopen);renderEditor();refresh()}
  else if(D.move){const [i,d]=D.move.split('.').map(Number);move(S.sections,i,d);rerender()}
  else if(D.lmove){const k=D.lmove.split('.');const d=+k.pop(),i=+k.pop();move(get(k.join('.')),i,d);rerender()}
  else if(D.add){get(D.add).push(JSON.parse(D.blank));rerender()}
  else if(D.del){const [p,i]=splitIdx(D.del);get(p).splice(i,1);rerender()}
  else if(D.libadd){const sel=document.getElementById('lib-'+D.libadd.replace(/\./g,'-'));const l=LIB[+sel.value];const items=get(D.libadd+'.items');items.push(kpi({...l}));openK.add(`${D.libadd}.items.${items.length-1}`);rerender();toast(l.label+' added. Fill in actual and target.')}
  else if(D.kadd){const items=get(D.kadd+'.items');items.push(kpi({label:'New KPI'}));openK.add(`${D.kadd}.items.${items.length-1}`);rerender()}
  else if(D.ctype){const [bp,ct]=D.ctype.split('|');setCType(get(bp),ct);rerender()}
  else if(D.radd){const d=get(D.radd);d.rows.push({label:'',v:d.series.map(()=>'')});rerender()}
  else if(D.sadd){const d=get(D.sadd);d.series.push('Series '+(d.series.length+1));d.rows.forEach(r=>r.v.push(''));rerender()}
  else if(D.sdel){const [bp,j]=splitIdx(D.sdel);const d=get(bp);d.series.splice(j,1);d.rows.forEach(r=>r.v.splice(j,1));rerender()}
  else if(D.cmadd){const d=get(D.cmadd);d.metrics.push({label:'New KPI',unit:'%',dir:DIRS[0]});d.clients.forEach(c=>c.values.push({actual:'',target:''}));rerender()}
  else if(D.cmdel){const [p,j]=splitIdx(D.cmdel);const d=get(p);d.metrics.splice(j,1);d.clients.forEach(c=>c.values.splice(j,1));rerender()}
  else if(D.cadd){const d=get(D.cadd);d.clients.push({name:'Client '+String.fromCharCode(65+d.clients.length),values:d.metrics.map(()=>({actual:'',target:''}))});rerender()}
  else if(D.imp){const [kind,bp,id]=D.imp.split('|');const msg=importGrid(kind,bp,document.getElementById(id).value);rerender();toast(msg)}
  else if(D.exp){const [kind,bp]=D.exp.split('|');copyText(exportGrid(kind,bp),'Grid copied. Paste it into Excel, fill it in, then copy it back.')}
  else if(D.themePick){S.theme=D.themePick;rerender()}
  else if(D.dup){const i=+D.dup;const c=structuredClone(S.sections[i]);c.id=nid();c.status='Draft';S.sections.splice(i+1,0,c);openIds.add(c.id);rerender()}
  else if(D.askdel){pendingDel=D.askdel;renderEditor()}
  else if(D.canceldel!==undefined){pendingDel=null;renderEditor()}
  else if(D.delsec){S.sections.splice(+D.delsec,1);pendingDel=null;rerender();toast('Section deleted')}
  else if(D.layout!==undefined){pendingLayout=+D.layout;renderEditor()}
  else if(D.dellayout!==undefined){LAYOUTS.splice(+D.dellayout,1);store.set(TPL,LAYOUTS);pendingLayout=null;renderEditor();toast('Layout deleted')}
  else if(D.acopy!==undefined){copyHtmlRich(`<div style="background:#ffffff">${renderNewsletter(ARCHIVE[+D.acopy].state)}</div>`,'')}
  else if(D.arestore!==undefined){pendingRestore=+D.arestore;renderEditor()}
  else if(b.id==='yesLayout'){const rows=[...Object.keys(BUILTIN).map(k=>BUILTIN[k].map(type=>({type}))),...LAYOUTS.map(l=>l.sections.map(s=>({type:s.type,full:s})))];
    applyLayout(rows[pendingLayout]);pendingLayout=null;rerender();toast('Layout applied')}
  else if(b.id==='noLayout'){pendingLayout=null;renderEditor()}
  else if(b.id==='saveLayout'){const nmv=document.getElementById('layoutName').value.trim();if(!nmv){toast('Give the layout a name first.');return}
    LAYOUTS=LAYOUTS.filter(l=>l.name!==nmv);LAYOUTS.push({name:nmv,sections:structuredClone(S.sections)});toast(store.set(TPL,LAYOUTS)?`Layout “${nmv}” saved`:'Layout kept for this visit only (browser storage is off)');renderEditor()}
  else if(b.id==='yesRestore'){S=normalize(structuredClone(ARCHIVE[pendingRestore].state));pendingRestore=null;rerender();toast('Issue restored')}
  else if(b.id==='noRestore'){pendingRestore=null;renderEditor()}
  else if(b.id==='suggestBtn'){suggestion=draftHeadline();renderEditor();refresh()}
  else if(b.id==='useSug'){S.headline=suggestion;suggestion=null;rerender();toast('Headline updated. Edit it as needed.')}
  else if(b.id==='dropSug'){suggestion=null;renderEditor();refresh()}
  else if(b.id==='addSec'){const type=document.getElementById('addType').value;const s=sec(type);S.sections.push(s);openIds.add(s.id);rerender();goTo('card-'+s.id);toast(TYPES[type].name+' added at the end')}
  else if(b.id==='copyJson')copyText(JSON.stringify(S),'Backup copied. Send it to a colleague or keep it somewhere safe.');
  else if(b.id==='loadSample'){S=SAMPLE();rerender();toast('Example issue loaded')}
  else if(b.id==='doRestore'){try{const d=JSON.parse(document.getElementById('restore').value);if(!d.sections)throw 0;S=normalize(d);rerender();toast('Backup restored')}catch(_){toast('That backup could not be read. Paste the full text from “Copy backup”.')}}
}
ed.addEventListener('click',onClick);document.getElementById('rail').addEventListener('click',onClick);
/* drag to reorder sections */
ed.addEventListener('dragstart',e=>{const g=e.target.closest('[data-grip]');if(!g){return}dragFrom=+g.dataset.grip;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragFrom))}catch(_){}
  const c=g.closest('.card');c.classList.add('dragging');try{e.dataTransfer.setDragImage(c,20,20)}catch(_){}});
ed.addEventListener('dragover',e=>{if(dragFrom===null)return;const c=e.target.closest('.card');if(!c)return;e.preventDefault();ed.querySelectorAll('.dropto').forEach(x=>x!==c&&x.classList.remove('dropto'));c.classList.add('dropto')});
ed.addEventListener('drop',e=>{if(dragFrom===null)return;const c=e.target.closest('.card');if(!c)return;e.preventDefault();let to=+c.dataset.idx;const [it]=S.sections.splice(dragFrom,1);if(to>dragFrom)to--;S.sections.splice(to,0,it);dragFrom=null;rerender()});
ed.addEventListener('dragend',()=>{dragFrom=null;ed.querySelectorAll('.dropto,.dragging').forEach(x=>x.classList.remove('dropto','dragging'))});

async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(_){toast('Copy was blocked. Select the text and copy it manually.')}ta.remove()}}
async function copyHtmlRich(html,suffix){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([tmp.innerText],{type:'text/plain'})})]);toast('Copied. Paste into your email.'+suffix)}
  catch(e){tmp.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(tmp);const r=document.createRange();r.selectNodeContents(tmp);const s=getSelection();s.removeAllRanges();s.addRange(r);
    try{document.execCommand('copy');toast('Copied. Paste into your email.'+suffix)}catch(_){toast('Copy was blocked. Select the preview and copy it manually.')}s.removeAllRanges();tmp.remove()}}
const emailHtml=()=>`<div style="background:#ffffff">${renderNewsletter()}</div>`;
const checkSuffix=()=>{const n=document.getElementById('chkChip').textContent;return n.includes('review')?` Note: ${n} in the pre-send check.`:''};
document.getElementById('copyHtml').onclick=()=>copyText(emailHtml(),'HTML copied.'+checkSuffix());
document.getElementById('copyRich').onclick=()=>copyHtmlRich(emailHtml(),checkSuffix());
document.getElementById('editionSel').onchange=e=>{S.edition=e.target.value;rerender()};
document.getElementById('chkChip').onclick=()=>{document.body.dataset.view='edit';setTabs();goTo('checkPanel')};
document.getElementById('pvDesk').onclick=()=>{UI.pv='desk';store.set(UIKEY,UI);applyPv()};
document.getElementById('pvPhone').onclick=()=>{UI.pv='phone';store.set(UIKEY,UI);applyPv()};
document.getElementById('nextMonth').onclick=()=>{
  if(document.getElementById('confirmNext'))return;
  const c=document.createElement('div');c.className='confirm';c.id='confirmNext';
  c.innerHTML=`<p>Start next month? This issue is saved under Past issues and its KPIs feed the trend bars. KPI actuals become “last month”, client actuals clear (targets stay), the month advances, statuses reset to Draft, and chart insights, the watch item, story and asks are cleared. Layout, chart data, initiatives, pipeline and year-to-date figures carry over.</p><button class="primary" id="yesNext">Start next month</button><button id="noNext">Cancel</button>`;
  ed.prepend(c);document.body.dataset.view='edit';setTabs();scrollTo(0,0);
  c.querySelector('#noNext').onclick=()=>c.remove();
  c.querySelector('#yesNext').onclick=()=>{
    ARCHIVE.unshift({savedAt:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),state:structuredClone(S)});ARCHIVE=ARCHIVE.slice(0,24);store.set(ARCH,ARCHIVE);
    const kp={};S.sections.filter(s=>s.type==='kpis').forEach(s=>s.data.items.forEach(m=>{const v=num(m.actual);if(v!==null&&m.label)kp[m.label]=v}));
    S.history=[...S.history.filter(h=>h.month!==S.month),{month:S.month,kpis:kp}].slice(-12);
    const dt=new Date('1 '+S.month);if(!isNaN(dt)){dt.setMonth(dt.getMonth()+1);S.month=dt.toLocaleString('en-US',{month:'long',year:'numeric'})}
    S.headline='';S.asOf='';S.highlights.forEach(h=>h.value='');
    S.sections.forEach(s=>{const d=s.data;s.status='Draft';
      if(s.type==='kpis')d.items.forEach(m=>{m.prev=m.actual;m.actual='';m.note=''});
      if(s.type==='clients')d.clients.forEach(cl=>cl.values.forEach(v=>v.actual=''));
      if(s.type==='ytd'){const m=num(d.months);if(m!==null&&m<12)d.months=String(m+1)}
      if(s.type==='chart')d.insight='';
      if(s.type==='watch'){d.title='';d.link='';d.radar='';d.rows.forEach(r=>r.text='')}
      if(s.type==='story'){s.title='';d.lesson='';d.steps.forEach(x=>x.text='')}
      if(s.type==='asks')d.items=[{text:''}];
    });
    c.remove();rerender();toast('Ready for '+S.month+'. Last issue saved under Past issues.');
  };
};
function setTabs(){const v=document.body.dataset.view;document.getElementById('tabEdit').setAttribute('aria-pressed',v==='edit');document.getElementById('tabPrev').setAttribute('aria-pressed',v==='preview')}
document.getElementById('tabEdit').onclick=()=>{document.body.dataset.view='edit';setTabs()};
document.getElementById('tabPrev').onclick=()=>{document.body.dataset.view='preview';setTabs();scrollTo(0,0)};
document.body.dataset.view='edit';
applyPv();rerender();
</script>
