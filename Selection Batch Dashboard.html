<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Selection Batch Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: report-builder shell. Header + page tabs + filter strip, 12-col visual grid, right-side field pane for editing */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#E4EAE7; --ink:#14201C; --muted:#56675F; --line:#CFD9D4;
  --accent:#16695A; --accent-ink:#FFFFFF; --accent-soft:#D5EBE3; --good:#1B7A47; --bad:#B23C2A; --warn:#9A6A12;
  --c1:#16695A; --c2:#3A64C8; --c3:#C9862A; --c4:#A9467A; --c5:#6A57C7; --c6:#2F93B3; --c7:#7F8F2E; --c8:#BF5534;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 6px 20px -12px rgba(20,32,28,.18);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151E1B; --surface-2:#1C2724; --ink:#E2EBE7; --muted:#90A39B; --line:#283631;
  --accent:#5CC3A5; --accent-ink:#06201A; --accent-soft:#1A3A31; --good:#5BCB8D; --bad:#EF7F69; --warn:#E0B055;
  --c1:#5CC3A5; --c2:#7B9EF0; --c3:#E5A653; --c4:#DB7FAE; --c5:#A595F0; --c6:#5CBEDB; --c7:#B4C45B; --c8:#EE8A66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151E1B; --surface-2:#1C2724; --ink:#E2EBE7; --muted:#90A39B; --line:#283631;
  --accent:#5CC3A5; --accent-ink:#06201A; --accent-soft:#1A3A31; --good:#5BCB8D; --bad:#EF7F69; --warn:#E0B055;
  --c1:#5CC3A5; --c2:#7B9EF0; --c3:#E5A653; --c4:#DB7FAE; --c5:#A595F0; --c6:#5CBEDB; --c7:#B4C45B; --c8:#EE8A66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.brand p b{font-weight:600;color:var(--ink)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn svg{width:15px;height:15px;flex:none}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;font-size:13px;max-width:100%}

.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:9px 12px;font-size:13px}
.note b{font-weight:650}
.drop-hint{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 14px 10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.sys{font-weight:500}
.tab .count{font-family:var(--f-data);font-size:10.5px;background:var(--surface-2);border-radius:9px;padding:1px 6px;color:var(--muted)}
.tab-add{color:var(--accent)}

/* filter bar */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.fb-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);cursor:pointer;font-size:12.5px;max-width:280px}
.chip:hover{border-color:var(--muted)}
.chip .k{color:var(--muted)}
.chip .v{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip svg{width:12px;height:12px;flex:none;color:var(--muted)}
.datebox{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.datebox select{padding:3px 6px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.fb-end{margin-left:auto;display:flex;gap:4px;align-items:center}

/* popover */
.pop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(300px,calc(100vw - 32px));padding:10px;display:flex;flex-direction:column;gap:8px}
.pop input[type=search],.pop input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 8px;font-size:13px}
.pop .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pop .list{max-height:260px;overflow:auto;display:flex;flex-direction:column}
.pop label.opt{display:flex;gap:8px;align-items:center;padding:4px 4px;border-radius:4px;cursor:pointer;font-size:13px}
.pop label.opt:hover{background:var(--surface-2)}
.pop label.opt span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .n{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.pop h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0;font-weight:600}
.pop .pick{border:0;background:none;text-align:left;padding:6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.pop .pick:hover{background:var(--surface-2)}
.role{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--surface-2);color:var(--muted);flex:none}
.role.measure{color:var(--c2)} .role.date{color:var(--c3)} .role.dimension{color:var(--c1)} .role.calc{color:var(--c5)}

/* page toolbar */
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pagebar h2{font-family:var(--f-display);font-stretch:90%;font-size:17px;font-weight:700;margin:0}
.pagebar .hint{color:var(--muted);font-size:12.5px}
.pagebar .acts{display:flex;gap:6px;flex-wrap:wrap}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.kpi .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .val{font-family:var(--f-display);font-stretch:88%;font-weight:750;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;min-width:0}
.delta{font-family:var(--f-data);font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.delta.flat{color:var(--muted);background:var(--surface-2)}
.delta small{color:var(--muted);font-size:10px;margin-left:4px}
.spark{width:72px;height:26px;flex:0 1 72px;min-width:36px}
.kpi.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;font-weight:600;min-height:96px}
.kpi.add:hover{background:var(--surface)}

/* visual grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;grid-column:span 6}
.viz.s3{grid-column:span 3}.viz.s4{grid-column:span 4}.viz.s6{grid-column:span 6}.viz.s8{grid-column:span 8}.viz.s12{grid-column:span 12}
.viz.picked,.kpi.picked{outline:2px solid var(--accent);outline-offset:-1px}
.viz header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 10px 0 14px}
.viz h3{margin:0;font-size:13.5px;font-weight:650;line-height:1.3}
.viz .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.viz-body{position:relative;height:290px;padding:6px 12px 12px}
.viz-body.tbl{height:auto;max-height:420px;overflow:auto;padding:6px 0 4px}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.icon{border:0;background:none;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg{width:16px;height:16px}
.viz.add{border-style:dashed;background:transparent;display:grid;place-items:center;min-height:120px;color:var(--accent);font-weight:600;cursor:pointer}
.viz.add:hover{background:var(--surface)}

/* tables */
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{padding:6px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;z-index:1}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:650;border-top:1.5px solid var(--ink);border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t td.clk{cursor:pointer}
.bar-cell{position:relative}
.bar-cell i{position:absolute;right:12px;bottom:3px;height:3px;background:var(--accent);opacity:.55;border-radius:2px;z-index:0}
.bar-cell span{position:relative;z-index:1}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-size:15px;font-weight:700}
.panel p.d{margin:0;color:var(--muted);font-size:12.5px;max-width:75ch}
.scroll{overflow-x:auto}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolrow input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 10px;min-width:0;width:240px;max-width:100%}
.pager{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.newtag{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.calcform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.calcform label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.calcform input,.calcform select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;font-size:13px;color:var(--ink);font-weight:400}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.drawer-h h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.drawer-b{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lbl{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.02em}
.fld input[type=text],.fld input[type=number],.fld select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 8px;font-size:13px;width:100%}
.fld .help{font-size:11.5px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.types button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 4px 6px;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.types button svg{width:20px;height:16px}
.types button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.valrow{display:grid;grid-template-columns:1fr 104px 28px;gap:5px;align-items:center}
.valrow .axis{grid-column:1/-1;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.drawer-acts{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.scrim{position:fixed;inset:0;z-index:45;background:transparent}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:13px;max-width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--bg);text-decoration:underline;cursor:pointer;font-weight:600}

@media (max-width:1000px){.viz.s3,.viz.s4{grid-column:span 6}.viz.s8{grid-column:span 12}}
@media (max-width:720px){.viz,.viz.s3,.viz.s4,.viz.s6,.viz.s8{grid-column:span 12}.viz-body{height:250px}.fb-end{margin-left:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:22px}.spark{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      <label class="btn primary" for="fileIn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v3h11v-3"/></svg>Upload Excel / CSV</label>

  <div id="sampleNote" class="note" hidden></div>

</div>

function loadTable(name, headers, rows, opts = {}) {
  const prev = lsGet(LS_LAYOUT);

  // clean headers
  const seen = {};
  headers = headers.map((h, i) => {
    let s = (h == null || String(h).trim() === '') ? `Column ${i + 1}` : String(h).trim();
    if (seen[s]) s = `${s} (${++seen[s]})`; else seen[s] = 1; return s;
  });
  S.name = name; S.isSample = !!opts.isSample; S.headers = headers; S.N = rows.length; S.cols = {}; S.schema = {};
  headers.forEach((h, j) => { S.cols[h] = { raw: rows.map(r => r[j] ?? null) }; });
  const overrides = prev?.overrides || {};
  for (const h of headers) {
    const det = detectColumn(h, S.cols[h].raw);
    S.schema[h] = { ...det, detected: det.role, ...(overrides[h] || {}) };
    prepColumn(h);
  }
  S.newCols = known ? headers.filter(h => !known.includes(h)) : [];
  S.calcs = prev?.calcs || [];

  S.primaryDate = (prev?.primaryDate && isDate(prev.primaryDate)) ? prev.primaryDate : (ds[0] || '');
  S.filters = { dims: {}, ranges: {}, from: '', to: '' };
  S.filterBar = prev?.filterBar ? prev.filterBar.filter(h => S.schema[h]) : defaultFilterBar();
  // new dimension columns join the filter bar automatically
  for (const h of S.newCols) if (isDim(h) && S.schema[h].card >= 2 && S.schema[h].card <= 500 && !S.filterBar.includes(h)) S.filterBar.push(h);
  if (prev?.pages?.length) { S.pages = prev.pages; S.active = prev.active || prev.pages[0].id; repairLayout(); }
  else { S.pages = defaultLayout(); S.active = S.pages[0].id; }
  S.table = { q: '', sort: null, dir: 1, page: 0 };
  saveLayout();
  if (!opts.isSample && !opts.restored) { const ok = lsSet(LS_DATA, { name, sheet: S.sheet, headers, rows: rows.map(r => r.map(v => v instanceof Date ? { $d: v.toISOString() } : v)) }); if (!ok) try { localStorage.removeItem(LS_DATA); } catch {} }
  renderAll();
  if (S.newCols.length) toast(`${S.newCols.length} new column${S.newCols.length > 1 ? 's' : ''} found: ${S.newCols.slice(0, 5).join(', ')}${S.newCols.length > 5 ? '…' : ''}. They're ready in filters, KPIs and every chart's field lists.`, 'Review fields', () => go('model'), 9000);
}
function saveLayout() {
  const overrides = {};
  for (const h of S.headers) { const s = S.schema[h]; overrides[h] = { role: s.role, fmt: s.fmt, agg: s.agg, dateKind: s.dateKind }; }
  const prev = lsGet(LS_LAYOUT) || {};
  lsSet(LS_LAYOUT, { pages: S.pages, calcs: S.calcs, active: S.active, primaryDate: S.primaryDate, filterBar: S.filterBar,
    overrides: { ...(prev.overrides || {}), ...overrides }, knownCols: [...new Set([...(prev.knownCols || []), ...S.headers])] });
}
let saveT; const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(saveLayout, 250); };

function readWorkbook(file) {

  fr.onload = e => {
    try {
      const isText = /\.(csv|tsv|txt)$/i.test(file.name);
      const wb = isText ? XLSX.read(e.target.result, { type: 'string', cellDates: true, raw: false }) : XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      S.wb = wb; S.fileName = file.name.replace(/\.[^.]+$/, '');
      const sel = $('#sheetSel');
      sel.innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join('');
      sel.hidden = wb.SheetNames.length < 2;
      loadSheet(wb.SheetNames[0]);
    } catch (err) { toast(`Couldn't read ${file.name}. Save it as .xlsx or .csv and try again. (${err.message})`); }

function loadSheet(name) {
  const ws = S.wb.Sheets[name];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  if (!aoa.length) { toast(`Sheet "${name}" is empty.`); return; }
  // header = first row among the first 10 that is at least half as wide as the widest row
  const width = Math.max(...aoa.slice(0, 50).map(r => r.filter(v => v != null && v !== '').length));
  let hr = aoa.findIndex((r, i) => i < 10 && r.filter(v => v != null && v !== '').length >= Math.max(2, width * .5));
  if (hr < 0) hr = 0;

  const keep = headers.map((h, j) => (h != null && String(h).trim() !== '') || rows.some(r => r[j] != null && r[j] !== ''));
  S.sheet = name;
  loadTable(`${S.fileName}${S.wb.SheetNames.length > 1 ? ' › ' + name : ''}`, headers.filter((_, j) => keep[j]), rows.map(r => r.filter((_, j) => keep[j])));

/* ---------- KPI cards ---------- */
function kpiHtml(k, idx) {

        }

/* ---------- Data shaping for a visual ---------- */
function shape(c, idx) {
  const xIsDate = c.x && isDate(c.x);
  const g = groupIdx(idx, c.x, c.grain);
  const v0 = c.values[0];
  let cats = [...g.entries()].map(([key, ix]) => ({ key, ix, label: c.x ? (xIsDate ? grainLabel(key, c.grain) : key) : 'Total' }));
  if (xIsDate) cats.sort((a, b) => a.key < b.key ? -1 : 1);
  else {
    cats.forEach(o => o.sv = measure(o.ix, v0.field, v0.agg) ?? -Infinity);
    if (c.sort === 'asc') cats.sort((a, b) => a.sv - b.sv);
    else if (c.sort === 'label') cats.sort((a, b) => a.label.localeCompare(b.label, undefined, { numeric: true }));
    else cats.sort((a, b) => b.sv - a.sv);
    if (c.topN > 0 && cats.length > c.topN) {
      const rest = cats.slice(c.topN); cats = cats.slice(0, c.topN);
      if (c.other) cats.push({ key: '__other', label: `Other (${rest.length})`, ix: rest.flatMap(r => r.ix) });
    }
  }
  let series = null;
  if (c.groupBy && c.groupBy !== c.x && c.values.length === 1 && !['donut', 'combo'].includes(c.type)) {
    const sIsDate = isDate(c.groupBy);
    const sg = groupIdx(idx, c.groupBy, c.grain);
    let keys = [...sg.entries()].map(([k, ix]) => ({ key: k, label: sIsDate ? grainLabel(k, c.grain) : k, tot: measure(ix, v0.field, v0.agg) ?? 0 }));
    if (sIsDate) keys.sort((a, b) => a.key < b.key ? -1 : 1); else keys.sort((a, b) => b.tot - a.tot);
    const cap = c.type === 'table' ? 14 : 8;
    const extra = keys.length > cap ? keys.slice(cap) : [];
    keys = keys.slice(0, cap);
    if (extra.length) keys.push({ key: '__other', label: `Other (${extra.length})`, members: new Set(extra.map(e => e.key)) });
    const scol = S.cols[c.groupBy];
    const skey = i => sIsDate ? (grainKey(scol.date[i], c.grain) ?? '(Blank)') : scol.str[i];
    series = keys.map(k => ({ ...k, cell: cats.map(cat => { const ix = cat.ix.filter(i => k.members ? k.members.has(skey(i)) : skey(i) === k.key); return ix.length ? measure(ix, v0.field, v0.agg) : null; }) }));
  }
  return { cats, series };
}

    if (c.groupBy && c.groupBy !== c.x) {
      const gcol = S.cols[c.groupBy]; const gk = i => isDate(c.groupBy) ? grainLabel(grainKey(gcol.date[i], c.grain), c.grain) : gcol.str[i];
      const groups = new Map();

      datasets = [...groups.entries()].map(([k, arr], i) => ({ label: k, data: arr, backgroundColor: alpha(pal[i % pal.length], .75), borderColor: pal[i % pal.length], pointRadius: 5, pointHoverRadius: 7 }));

$('#drawerBody').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const d = S.drawer, p = currentPage(); if (!d || !p) return;
  const a = btn.dataset.a;
  if (d.kind === 'page') {
    const i = S.pages.indexOf(p);
    if (a === 'pg-left' && i > 0) [S.pages[i - 1], S.pages[i]] = [S.pages[i], S.pages[i - 1]];
    if (a === 'pg-right' && i < S.pages.length - 1) [S.pages[i + 1], S.pages[i]] = [S.pages[i], S.pages[i + 1]];
    if (a === 'pg-dup') { const cp = JSON.parse(JSON.stringify(p)); cp.id = uid(); cp.name = p.name + ' copy'; cp.kpis.forEach(k => k.id = uid()); cp.charts.forEach(c => c.id = uid()); S.pages.splice(i + 1, 0, cp); S.active = cp.id; closeDrawer(); renderTabs(); renderView(); }

      if (btn.dataset.sure) { S.pages.splice(i, 1); S.active = S.pages[Math.max(0, i - 1)].id; closeDrawer(); renderTabs(); renderView(); toast(`Deleted page "${p.name}".`); }
      else { btn.dataset.sure = 1; btn.textContent = 'Click again to delete'; }
    }

  }
  const list = d.kind === 'kpi' ? p.kpis : p.charts;
  const i = list.findIndex(x => x.id === d.id); const item = list[i];
  if (btn.dataset.type) { const old = item.type; item.type = btn.dataset.type;
    if (item.type === 'scatter' && item.values.length < 2) { const m = measures().find(h => h !== item.values[0].field) || ROWS; item.values.push({ field: m, agg: defaultAgg(m) }); if (item.x && isDate(item.x)) item.x = dims().sort((x, y) => S.schema[y].card - S.schema[x].card)[0] || item.x; }
    if (item.type === 'combo' && item.values.length < 2) { const m = measures().find(h => h !== item.values[0].field && S.schema[h].fmt === 'percent') || measures().find(h => h !== item.values[0].field) || ROWS; item.values.push({ field: m, agg: defaultAgg(m) }); }

  if (a === 'addval') { const used = new Set(item.values.map(v => v.field)); const m = measures().find(h => !used.has(h)) || ROWS; item.values.push({ field: m, agg: defaultAgg(m) }); if (item.values.length > 1 && item.type !== 'scatter') item.groupBy = ''; buildDrawer(); return redrawOne(item); }
  if (a === 'left' && i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; renderView(); }
  if (a === 'right' && i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; renderView(); }
  if (a === 'dup') { const cp = JSON.parse(JSON.stringify(item)); cp.id = uid(); list.splice(i + 1, 0, cp); S.drawer.id = cp.id; renderView(); buildDrawer(); }

addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#dropHint').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dropHint').hidden = true; const f = e.dataTransfer.files[0]; if (f) readWorkbook(f); });

let toastT;
function toast(msg, actLabel, act, ms = 4500) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button type="button">${esc(actLabel)}</button>` : ''}`; t.hidden = false;
  if (actLabel) t.querySelector('button').onclick = () => { t.hidden = true; act(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}

// Theme changes: redraw charts with new token colours
const rerender = () => { if (!['data', 'model'].includes(S.active)) renderView(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch {}
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.charts.size) for (const c of S.charts.values()) { const d = c.config.type === 'doughnut'; if (d) { rerender(); break; } } }, 300); });

/* ============================================================
   BOOT
   ============================================================ */
function hashTarget() {
  const h = (location.hash || '').slice(1);
  if (h === 'data') return 'data'; if (h === 'fields') return 'model'; if (h === 'executive') return 'executive';
  if (h.startsWith('p')) return h.slice(1); return null;
}
function boot() {
  const saved = lsGet(LS_DATA);
  if (saved && saved.headers) {
    S.fileName = saved.name; S.sheet = saved.sheet || '';
    loadTable(saved.name, saved.headers, saved.rows.map(r => r.map(v => v && v.$d ? new Date(v.$d) : v)), { restored: true });
  } else loadTable(SAMPLE.name, SAMPLE.headers, SAMPLE.rows, { isSample: true });
  const h = hashTarget(); if (h && (['data', 'model'].includes(h) || S.pages.find(p => p.id === h))) go(h);
}
addEventListener('hashchange', () => { const h = hashTarget(); if (h && h !== S.active && (['data', 'model'].includes(h) || S.pages.find(p => p.id === h))) go(h); });
boot();
})();
</script>
