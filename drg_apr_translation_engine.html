<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS-DRG → APR-DRG Concept Translation Engine (Synthetic PoC)</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1c2733;--mute:#5b6b7b;--line:#dde3e9;--pri:#0f5b78;--pri2:#e6f1f5;--acc:#2a7f62;--warn:#b7791f;--bad:#b23b3b;--violet:#5b4b9a;--orig:#0f5b78;--tran:#c27c2c;--r:8px}
*{box-sizing:border-box}
body{margin:0;font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:#0d2f3f;color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
.syn{background:#f2c94c;color:#3a2a00;font-weight:700;font-size:11px;padding:3px 9px;border-radius:4px;letter-spacing:.6px}
.synline{font-size:11.5px;color:#cfe3ec}
header .sp{flex:1}
.layout{display:flex;min-height:calc(100vh - 44px)}
nav{width:218px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:44px;height:calc(100vh - 44px);overflow:auto}
nav a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13px}
nav a:hover{background:var(--pri2)}
nav a.on{background:var(--pri);color:#fff}
nav a .n{width:18px;text-align:right;color:var(--mute);font-size:11px}
nav a.on .n{color:#cfe3ec}
main{flex:1;min-width:0;padding:16px 20px 60px}
h2{font-size:18px;margin:2px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fb;font-weight:600;color:#33475b;position:sticky;top:0;cursor:default;white-space:nowrap}
th.s{cursor:pointer}
th.s:hover{color:var(--pri)}
tr.sel td{background:#eef6f9}
tr:hover td{background:#fafcfd}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:6px}
.num{text-align:right;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-size:12.5px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button.sec{background:#fff;color:var(--pri)}
button.gh{background:transparent;border-color:var(--line);color:var(--ink)}
button.bad{background:#fff;color:var(--bad);border-color:#e3b4b4}
button.ok{background:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:2px 7px;font-size:11.5px}
input,select,textarea{font:inherit;font-size:12.5px;border:1px solid #c9d3dc;border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:62px;resize:vertical}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-hi{background:#e3f3ec;color:#1d6b4f;border-color:#bfe3d3}
.b-part{background:#e8f0fb;color:#2a5aa0;border-color:#c8d9f2}
.b-multi{background:#efeafa;color:#5b4b9a;border-color:#d9cff2}
.b-sme{background:#fdf3e2;color:#9a5b0b;border-color:#f3dcb3}
.b-ins{background:#f1f1f1;color:#555;border-color:#ddd}
.b-not{background:#fbe9e9;color:#a33;border-color:#efc6c6}
.b-prov{background:#fff4d6;color:#7a5600;border-color:#f0dc9c}
.b-emp{background:#e3f3ec;color:#1d6b4f}
.b-st{background:#eef2f6;color:#33475b}
.note{background:#f7f9fb;border-left:3px solid var(--pri);padding:8px 10px;border-radius:4px;color:#33475b;font-size:12.5px;margin:8px 0}
.warn{background:#fff8ec;border-left:3px solid var(--warn);padding:8px 10px;border-radius:4px;font-size:12.5px;margin:6px 0}
.err{background:#fdf0f0;border-left:3px solid var(--bad);padding:8px 10px;border-radius:4px;font-size:12.5px;margin:6px 0}
.mute{color:var(--mute)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.bar .lb{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:#eef2f5;border-radius:3px;height:14px;position:relative;min-width:60px}
.bar .fl{height:100%;border-radius:3px;background:var(--pri)}
.bar .vl{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.cmp .tr{height:9px;margin:1px 0}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;min-width:90px;background:#eef2f5}
.s1{background:#cfe5ee}.s2{background:#7fb6cc}.s3{background:#2f7f9f}.s4{background:#0d3f55}
.heat td{text-align:center;font-size:11px;padding:4px;min-width:38px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cond{display:grid;grid-template-columns:150px 110px 1fr 28px;gap:6px;margin:4px 0;align-items:center}
.grp{border:1px dashed #b9c6d2;border-radius:6px;padding:8px;margin:6px 0;background:#fbfcfd}
.grp .gh{font-size:11.5px;color:var(--mute);margin-bottom:4px;display:flex;justify-content:space-between}
.or{font-size:11px;font-weight:700;color:var(--violet);text-align:center;margin:2px 0}
.gen{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fff}
.gen.prov{border-color:#f0dc9c}
.gen .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gen .hd b{font-size:14px}
.expl ol{margin:6px 0 0 18px;padding:0}
.expl li{margin:4px 0}
.side{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.side>div{padding:8px 10px;border-bottom:1px solid var(--line)}
.side .h{background:#f7f9fb;font-weight:600}
.pill{display:inline-block;background:#eef2f6;border-radius:4px;padding:1px 6px;margin:1px 2px;font-size:11.5px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.flow span{background:var(--pri2);border:1px solid #c6dde7;border-radius:6px;padding:5px 8px}
.flow em{color:var(--mute);font-style:normal}
.toast{position:fixed;bottom:18px;right:18px;background:#0d2f3f;color:#fff;padding:9px 14px;border-radius:6px;z-index:99;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
svg text{font-family:inherit}
details summary{cursor:pointer;color:var(--pri);font-size:12.5px}
@media (max-width:900px){header{position:static}.synline{font-size:10.5px}.layout{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;gap:2px;padding:6px}nav a{white-space:nowrap}main{padding:12px}.g2{grid-template-columns:1fr}.cond{grid-template-columns:1fr 1fr}.bar .lb{width:100px}.side{grid-template-columns:1fr}}
</style>
</head>

  }
  const PATTERNS = [
    [`\\b(?:ms[- ]?)?drgs?\\s*(?:=|:|is|in)?\\s*(\\d{3}(?:\\s*(?:,|/|&|\\bor\\b|\\band\\b)\\s*\\d{3})*)`, m => ({ field: 'ms_drg', op: 'in', value: m[1].match(/\d{3}/g) })],
    [`\\b(?:the\\s+)?mccs?\\s+(?:code\\s+)?(?:is|=|:|includes?|in)\\s*${CODES}`, m => ({ field: 'mcc_code', op: 'includes any', value: codes(m[1]) })],
    [`\\b(?:exclude|excluding|not)\\s+(?:a\\s+)?(?:principal|primary)\\s+(?:diagnosis|dx)\\s*(?:codes?)?\\s*(?:of|is|=|:)?\\s*${CODES}`, m => ({ field: 'pdx', op: 'not in', value: codes(m[1]) })],
    [`\\b(?:principal|primary)\\s+(?:diagnosis|dx)\\s*(?:codes?)?\\s*(?:is|=|of|in|includes?|:)?\\s*${CODES}`, m => ({ field: 'pdx', op: 'in', value: codes(m[1]) })],
    [`\\b(?:exclude|excluding|without|absence\\s+of|no)\\s+(?:any\\s+)?(?:secondary\\s+)?(?:diagnosis|diagnoses|dx|sdx)\\s*(?:codes?)?\\s*(?:of|:)?\\s*${CODES}`, m => ({ field: 'sdx', op: 'excludes', value: codes(m[1]) })],
    [`\\b(?:secondary\\s+(?:diagnosis|diagnoses|dx)|sdx|diagnosis|dx)\\s*(?:codes?)?\\s*(?:includes?|contains?|=|is|in|of|:)?\\s*${CODES}`, m => ({ field: 'sdx', op: 'includes any', value: codes(m[1]) })],
    [`\\b(?:exclude|excluding|without|no)\\s+(?:procedures?|px|pcs)\\s*(?:codes?)?\\s*(?:of|:)?\\s*${PCSL}`, m => ({ field: 'px', op: 'excludes', value: pcs(m[1]) })],
    [`\\b(?:procedures?|px|pcs)\\s*(?:codes?)?\\s*(?:includes?|=|is|of|:)?\\s*${PCSL}`, m => ({ field: 'px', op: 'includes any', value: pcs(m[1]) })],
    [`\\b(?:los|length\\s+of\\s+stay)\\s*(?:is\\s+)?(?:between\\s+)?(\\d+)\\s*(?:and|-|to|–)\\s*(\\d+)`, m => ({ field: 'los', op: 'between', value: [+m[1], +m[2]] })],
    [`\\b(?:los|length\\s+of\\s+stay)\\s*(?:days\\s*)?(?:is\\s+)?(${OPALT})\\s*(\\d+)(?:\\s*days?)?`, m => ({ field: 'los', op: opOf(m[1]), value: +m[2] })],
    [`\\bage\\s*(?:is\\s+)?(?:between\\s+)?(\\d+)\\s*(?:and|-|to)\\s*(\\d+)`, m => ({ field: 'age', op: 'between', value: [+m[1], +m[2]] })],
    [`\\bage\\s*(?:is\\s+)?(${OPALT})\\s*(\\d+)`, m => ({ field: 'age', op: opOf(m[1]), value: +m[2] })],
    [`\\bdischarge\\s+status\\s*(?:codes?)?\\s*(?:=|is|of|in|:)?\\s*(\\d{1,2}(?:\\s*(?:,|/|\\bor\\b)\\s*\\d{1,2})*)`, m => ({ field: 'discharge_status', op: 'in', value: m[1].match(/\d{1,2}/g).map(x => x.padStart(2, '0')) })],
    ...sevPatterns('mcc'), ...sevPatterns('cc')
  ].map(([re, fn]) => [new RegExp(re, 'gi'), fn]);
  const STOPW = new Set('select selecting choose claims claim cases case with and where the a an of in is are that which only any also to when for days day drg drgs ms ms-drg population encounters admissions or than code codes having has must be'.split(' '));

  function parseSegment(seg, descOf) {
    let s = ' ' + seg + ' ';
    const conds = [];
    for (const [re, fn] of PATTERNS) {
      re.lastIndex = 0;
      s = s.replace(re, (...m) => { const r = fn(m); if (r && (!Array.isArray(r.value) || r.value.length)) { conds.push(r); return ' \u2023 '; } return m[0]; });
    }
    const descWords = new Set();
    conds.forEach(c => { if (Array.isArray(c.value)) c.value.forEach(v => (descOf(v) || '').toLowerCase().split(/[^a-z0-9]+/).forEach(w => w && descWords.add(w))); });

    return { conds, leftover: left };
  }
  const keyOf = c => c.field + '|' + c.op + '|' + JSON.stringify(c.value);

  E.parseText = function (text, descOf) {
    descOf = descOf || (c => E.IX ? E.IX.desc(c) : '');
    const segs = U(text).split(/\s+OR\s+|\s*\|\|\s*/);
    const groups = [], warnings = [];
    segs.forEach((seg, i) => {
      const r = parseSegment(seg, descOf);
      groups.push(r.conds);
      if (r.leftover.length) warnings.push(`Unparsed text in ${segs.length > 1 ? 'OR-branch ' + (i + 1) : 'description'}: "${r.leftover.join(' ')}" — not converted; no restriction invented.`);
    });
    // inherit shared conditions of the first branch into later OR branches
    for (let k = 1; k < groups.length; k++) {
      const fields = new Set(groups[k].map(c => c.field));
      groups[0].forEach(c => { if (!fields.has(c.field)) groups[k].unshift(clone(c)); });
    }
    return { groups: groups.filter(g => g.length), warnings };
  };

  E.parseConcept = function (concept, descOf) {
    const P = E.parseText(concept.concept_description, descOf);
    const shared = [], warnings = P.warnings.slice();
    const numForm = (v, field) => { const m = U(v).match(/^(=|==|>=|<=|<|>|!=)?\s*(\d+)$/); return m ? { field, op: m[1] === '==' ? '=' : (m[1] || '='), value: +m[2] } : null; };
    const addText = (txt, label) => { if (!U(txt)) return; const r = E.parseText(txt, descOf); r.groups.forEach(g => shared.push(...g)); if (r.groups.length > 1) warnings.push(`Structured column "${label}" contains OR; branches were combined with AND.`); r.warnings.forEach(w => warnings.push(`[${label}] ` + w)); };
    if (U(concept.ms_drg)) { const d = U(concept.ms_drg).match(/\d{3}/g); if (d) shared.push({ field: 'ms_drg', op: 'in', value: d }); }
    [['mcc_condition', 'mcc_count', 'MCC'], ['cc_condition', 'cc_count', 'CC']].forEach(([col, f, w]) => { const v = concept[col]; if (!U(v)) return; const n = numForm(v, f); if (n) shared.push(n); else addText(/mcc|cc/i.test(v) ? v : v + ' ' + w, col); });
    if (U(concept.los_conditions)) addText(/los|length/i.test(concept.los_conditions) ? concept.los_conditions : 'LOS ' + concept.los_conditions, 'los_conditions');

    let groups = P.groups.length ? P.groups : (shared.length ? [[]] : []);
    groups = groups.map(g => {
      const keys = new Set(g.map(keyOf)), fields = new Set(g.map(c => c.field));
      shared.forEach(c => {
        if (keys.has(keyOf(c))) return;
        if (c.field === 'ms_drg' && fields.has('ms_drg')) return; // description DRG list takes precedence
        if (fields.has(c.field) && !['sdx', 'px'].includes(c.field)) warnings.push(`Structured column and description disagree on ${FIELDS[c.field].l} (${E.condText(c)}); both retained (AND).`);
        g.push(clone(c)); keys.add(keyOf(c));
      });
      return g;
    });
    groups = groups.map(g => { const seen = new Set(); return g.filter(c => { const k = keyOf(c); if (seen.has(k)) return false; seen.add(k); return true; }); });
    return { groups, warnings: [...new Set(warnings)], intent: E.intent(groups) };
  };

  E.intent = function (groups) {
    const f = new Set(groups.flat().map(c => c.field)), parts = [];
    if (f.has('ms_drg')) parts.push('DRG population selection');
    if (f.has('mcc_count') || f.has('cc_count')) parts.push('severity (MCC/CC) validation');
    if (f.has('mcc_code') || f.has('sdx')) parts.push('specific secondary-diagnosis validation');
    if (f.has('pdx')) parts.push('principal-diagnosis validation');
    if (f.has('los')) parts.push('length-of-stay screen');
    if (f.has('px')) parts.push('procedure restriction');
    if (f.has('age') || f.has('discharge_status')) parts.push('claim-attribute filter');

  };

  E.getParsed = function (concept, manual) {
    const auto = E.parseConcept(concept);

    return auto;
  };
  E.msCodes = groups => [...new Set(groups.flat().filter(c => c.field === 'ms_drg' && c.op === 'in').flatMap(c => c.value))];

  /* ---------------- condition evaluation ---------------- */
  const cm = (code, p) => { if (!code) return false; p = normCode(p); return p.endsWith('*') ? code.startsWith(p.slice(0, -1)) : code === p; };
  const fv = (c, f) => f === 'mcc_code' ? c.mcc_codes : c[f];
  E.test = function (k, c) {
    const v = fv(c, k.field), val = k.value, t = (FIELDS[k.field] || {}).t;
    if (t === 'list') { const hit = (v || []).some(x => val.some(p => cm(x, p))); return k.op === 'excludes' ? !hit : hit; }
    if (t === 'code' || t === 'dx') { const hit = val.some(p => t === 'dx' ? cm(v, p) : String(v) === String(p)); return k.op === 'not in' ? !hit : hit; }

  E.valStr = function (k) {

  E.strToVal = function (field, op, s) {

  };

  /* ---------------- similarity helpers ---------------- */
  const STOP = new Set('with without w o or and the of to for in on mcc cc hours hrs mv other others major minor diagnoses diagnosis disorders except unspecified than'.split(' '));
  const SYNM = { septicemia: 'sepsis', septic: 'sepsis', renal: 'kidney', cardiac: 'heart', pulmonary: 'lung', respiratory: 'lung', pneumonitis: 'pneumonia', infections: 'infection', infectious: 'infection', dysrhythmia: 'arrhythmia', fibrillation: 'arrhythmia', congestive: 'heart', copd: 'obstructive' };

  /* =====================================================================
     MODULE C — MS-DRG → APR-DRG RELATIONSHIP DISCOVERY
     ===================================================================== */
  E.candidates = function (concept, IX, cfg, manual) {
    const P = E.getParsed(concept, manual);
    const msCodes = E.msCodes(P.groups);
    const orig = E.select(P.groups, IX.claims);
    const msDesc = msCodes.map(m => (IX.ms.get(m) || {}).ms_drg_description || '').join(' ');
    const W = cfg.candW;
    const res = { msCodes, origN: orig.length, orig, list: [], mode: '', msKnown: msCodes.filter(m => IX.ms.has(m)) };
    if (cfg.useClaims && IX.hasClaims && orig.length) {
      res.mode = 'empirical';
      const origDx = new Set(orig.flatMap(i => [IX.claims[i].pdx, ...IX.claims[i].sdx]));
      const msAll = IX.claims.filter(c => msCodes.includes(c.ms_drg));
      const byApr = countBy(orig, i => IX.claims[i].apr_drg);

        const sub = orig.filter(i => IX.claims[i].apr_drg === a).map(i => IX.claims[i]);
        const ad = IX.aprDx.get(a) || { P: new Set(), S: new Set(), all: new Set() };

      });
    } else {

      const dxConds = new Set(P.groups.flat().filter(c => ['pdx', 'sdx', 'mcc_code'].includes(c.field) && !['not in', 'excludes'].includes(c.op)).flatMap(c => c.value));
      for (const [a, row] of IX.apr) {
        const ds = E.descSim(msDesc, row.apr_drg_description);
        const ad = IX.aprDx.get(a) || { all: new Set(), P: new Set() };
        const ov = dxConds.size ? E.overlap(dxConds, ad.all) : 0;
        const score = dxConds.size ? 0.6 * ds + 0.4 * ov : ds;

      }
    }
    res.list.sort((a, b) => b.score - a.score || b.n - a.n);
    res.list.forEach((c, i) => c.rank = i + 1);
    return res;
  };

  /* =====================================================================
     MODULE D — DIAGNOSIS TRANSLATION
     ===================================================================== */
  E.dxMapping = function (orig, apr, IX, cfg) {
    const claims = orig.map(i => IX.claims[i]);
    const freq = {};
    claims.forEach(c => { [[c.pdx, 'P'], ...c.sdx.map(d => [d, 'S'])].forEach(([d, r]) => { freq[d] = freq[d] || { P: 0, S: 0 }; freq[d][r]++; }); });
    const ad = IX.aprDx.get(apr) || { P: new Set(), S: new Set(), all: new Set(), lvl: new Map() };
    const aprCodes = [...ad.all];
    const rows = Object.keys(freq).map(d => {
      const f = freq[d], tot = f.P + f.S, pct = tot / Math.max(1, claims.length);
      let type = 'Unmatched', match = '', score = 0;
      if (ad.all.has(d)) { type = 'Exact'; match = d; score = 1; }
      else {
        let best = null, bs = 0;
        aprCodes.forEach(a => { const s = E.descSim(IX.desc(d), IX.desc(a)); if (s > bs) { bs = s; best = a; } });
        if (best && bs >= cfg.descThreshold) { type = 'Description-similar'; match = best; score = bs; }
        else if (cfg.familyMatch) { const fam = aprCodes.find(a => a.slice(0, 3) === d.slice(0, 3)); if (fam) { type = 'Family (category ' + d.slice(0, 3) + ')'; match = fam; score = 0.5; } }
      }
      const roleA = ad.P.has(d) && ad.S.has(d) ? 'P/S' : ad.P.has(d) ? 'P' : ad.S.has(d) ? 'S' : '';
      return { code: d, desc: IX.desc(d), P: f.P, S: f.S, pct, flag: IX.msFlag.get(d) || '', type, match, score, roleA, lvl: ad.lvl.get(d + '|S') || ad.lvl.get(d + '|P') || null };
    }).filter(r => r.pct >= (cfg.minDxFreq || 0)).sort((a, b) => (b.P + b.S) - (a.P + a.S));
    const A = new Set(rows.map(r => r.code));
    const exact = rows.filter(r => r.type === 'Exact').length, sim = rows.filter(r => r.type === 'Description-similar').length, fam = rows.filter(r => r.type.startsWith('Family')).length;
    const pA = new Set(rows.filter(r => r.P).map(r => r.code));
    const covW = rows.reduce((s, r) => s + (r.type === 'Exact' ? r.P + r.S : 0), 0) / Math.max(1, rows.reduce((s, r) => s + r.P + r.S, 0));
    return { rows, jaccard: E.jaccard(A, ad.all), overlap: E.overlap(A, ad.all), exact, sim, fam, unmatched: rows.length - exact - sim - fam, pdxJaccard: E.jaccard(pA, ad.P), weightedCoverage: covW, aprSize: ad.all.size };
  };

  /* =====================================================================
     MODULE E — SEVERITY TRANSLATION  P(APR SOI | MS-DRG, MCC, CC, dx)
     ===================================================================== */
  const bucket = (n, cap) => n >= cap ? cap + '+' : String(n);
  E.sevGrid = function (msCodes, apr, IX) {
    const cs = IX.claims.filter(c => msCodes.includes(c.ms_drg) && (!apr || c.apr_drg === apr));
    const grid = {};
    cs.forEach(c => { const k = bucket(c.mcc_count, 3) + '|' + bucket(c.cc_count, 2); grid[k] = grid[k] || {}; grid[k][c.soi] = (grid[k][c.soi] || 0) + 1; });
    return { grid, n: cs.length };
  };
  E.sevByMcc = function (msCodes, IX) {
    const cs = IX.claims.filter(c => msCodes.includes(c.ms_drg) && c.mcc_count === 1);
    const by = {}; cs.forEach(c => { const d = c.mcc_codes[0]; by[d] = by[d] || {}; by[d][c.soi] = (by[d][c.soi] || 0) + 1; });
    return Object.keys(by).map(d => ({ code: d, dist: by[d], n: Object.values(by[d]).reduce((a, b) => a + b, 0) })).sort((a, b) => b.n - a.n);
  };
  const RANGES = [[1], [2], [3], [4], [1, 2], [2, 3], [3, 4], [1, 2, 3], [2, 3, 4], [1, 2, 3, 4]];
  E.severityAnalysis = function (concept, apr, base, IX, cfg, manual) {
    const P = E.getParsed(concept, manual);
    const orig = E.select(P.groups, IX.claims);
    const target = orig.filter(i => IX.claims[i].apr_drg === apr), tSet = new Set(target);
    const dist = countBy(target, i => IX.claims[i].soi);
    const mc = P.groups.flat().find(c => c.field === 'mcc_count');
    const drv = [null];
    if (cfg.useDrivers && mc && typeof mc.value === 'number') {
      if (mc.op === '=' && mc.value >= 1) drv.push({ op: '=', value: mc.value }, { op: '>=', value: mc.value });
      else if (mc.op === '>=' && mc.value >= 1) drv.push({ op: '>=', value: mc.value });
      else if (mc.op === '>') drv.push({ op: '>=', value: mc.value + 1 });
    }
    const opts = [];
    for (const r of RANGES) for (const d of drv) {
      const groups = base.groups.map(g => { const ng = g.concat([{ field: 'soi', op: 'in', value: r.slice() }]); if (d) ng.push({ field: 'soi_drivers', op: d.op, value: d.value }); return ng; });
      const sel = E.select(groups, IX.claims); let inter = 0; sel.forEach(i => { if (tSet.has(i)) inter++; });
      const uni = target.length + sel.length - inter;
      opts.push({ soi: r, driver: d, n: sel.length, inter, cov: target.length ? inter / target.length : 0, fi: sel.length ? (sel.length - inter) / sel.length : 0, jac: uni ? inter / uni : 0, f1: (target.length + sel.length) ? 2 * inter / (target.length + sel.length) : 0, groups });
    }
    const obj = o => cfg.objective === 'f1' ? o.f1 : cfg.objective === 'coverage' ? (o.cov >= cfg.covTarget ? 1 + (1 - o.fi) : o.cov) : o.jac;
    opts.sort((a, b) => (Math.round((obj(b) - obj(a)) * 1e6)) || ((a.driver ? 1 : 0) - (b.driver ? 1 : 0)) || (a.soi.length - b.soi.length));
    const chosen = opts[0];
    const flags = [];
    if (target.length < cfg.minEvidence) flags.push('Insufficient evidence: only ' + target.length + ' original claims grouped to APR ' + apr + '.');
    else if (target.length < cfg.minVolume) flags.push('Low volume: ' + target.length + ' claims (< ' + cfg.minVolume + ' configured minimum).');
    return { apr, n: target.length, dist, options: opts, chosen, flags, mccCond: mc || null };
  };

  /* =====================================================================
     MODULE F — APR-DRG CONCEPT GENERATOR
     ===================================================================== */

  return `<div class="legend"><span><i style="background:var(--orig)"></i>Original MS-DRG concept</span><span><i style="background:var(--tran)"></i>Translated APR-DRG concept</span></div>` + keys.map(k => { const x = (a[k] || 0) / sa, y = (b[k] || 0) / sb; return `<div class="bar cmp"><span class="lb" title="${esc(lab ? lab(k) : k)}">${esc(lab ? lab(k) : k)}</span><span style="flex:1"><span class="tr" style="display:block"><span class="fl" style="display:block;width:${(x * 100).toFixed(1)}%;background:var(--orig)"></span></span><span class="tr" style="display:block"><span class="fl" style="display:block;width:${(y * 100).toFixed(1)}%;background:var(--tran)"></span></span></span><span class="vl">${pct(x)} / ${pct(y)}</span></div>`; }).join('');
}
function stack(dist) {
  const n = sum(dist); if (!n) return '<span class="mute">—</span>';
  return `<div class="stack" title="${[1, 2, 3, 4].map(s => 'SOI ' + s + ': ' + (dist[s] || 0)).join(' | ')}">${[1, 2, 3, 4].map(s => dist[s] ? `<span class="s${s}" style="width:${(100 * dist[s] / n).toFixed(1)}%"></span>` : '').join('')}</div>`;
}
const soiLegend = `<div class="legend">${[1, 2, 3, 4].map(s => `<span><i class="s${s}"></i>SOI ${s}</span>`).join('')}</div>`;
const distTxt = d => { const n = sum(d); return [1, 2, 3, 4].filter(s => d[s]).map(s => `S${s} ${pct(d[s] / n)}`).join(' · ') || '—'; };

/* ---------------- tables ---------------- */
function tbl(key, cols, rows, opt = {}) {
  const st = S.ui.sort[key];
  if (st) { const col = cols.find(c => c.k === st.k); if (col) { const g = r => col.sv ? col.sv(r) : r[col.k]; rows = rows.slice().sort((x, y) => { const a = g(x), b = g(y); return (a > b ? 1 : a < b ? -1 : 0) * st.d; }); } }
  return `<div class="tw" ${opt.h ? `style="max-height:${opt.h}px"` : ''}><table><thead><tr>${cols.map(c => `<th class="${c.ns ? '' : 's'} ${c.num ? 'num' : ''}" ${c.ns ? '' : `onclick="A.sort('${key}','${c.k}')"`}>${esc(c.l)}${st && st.k === c.k ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr ${opt.attr ? opt.attr(r) : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''}" ${c.w ? `style="min-width:${c.w}px"` : ''}>${c.r ? c.r(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="mute">No rows</td></tr>`}</tbody></table></div>`;
}

function candFor(id) { return memo('cand|' + id, () => ENG.candidates(conceptById(id), IX, S.cfg, S.manual)); }

function head(title, sub) { return `<h2>${esc(title)} <span class="syn" style="font-size:10px;vertical-align:3px">SYNTHETIC DATA</span></h2><p class="sub">${sub}</p>`; }
function evidenceBadge(mode) { return mode === 'empirical' ? '<span class="badge b-emp">Empirically validated (paired claims)</span>' : '<span class="badge b-prov">Provisional — diagnosis/description-based</span>'; }
function condEditor(t, groups) {

}

     ${auto.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join('')}</div>
     <div class="grid g2"><div class="card"><h3>Structured output</h3><ul style="margin:0;padding-left:18px">${flat.length ? [...new Map(flat.map(k => [ENG.condText(k), k])).keys()].map(t => `<li>${esc(t)}</li>`).join('') : '<li class="mute">No conditions</li>'}<li><b>Concept intent</b> = ${esc(intent)}</li>${d.length > 1 ? `<li><b>Logic</b>: ${d.length} OR-groups</li>` : ''}</ul>

       <details style="margin-top:10px"><summary>Supported grammar</summary><div class="mute" style="font-size:12px;margin-top:6px">DRG lists (<span class="mono">DRG 871 or 872</span>) · MCC/CC counts (<span class="mono">exactly one MCC</span>, <span class="mono">at least 2 MCC</span>, <span class="mono">no CC</span>, <span class="mono">MCC count = 1</span>) · <span class="mono">where the MCC is G93.41</span> · <span class="mono">principal diagnosis A41.9</span> · <span class="mono">secondary diagnosis includes R65.20</span> · <span class="mono">exclude diagnosis E43</span> · <span class="mono">exclude procedure 5A1945Z</span> · LOS (<span class="mono">LOS less than 12</span>, <span class="mono">LOS between 2 and 5</span>, <span class="mono">LOS &gt;= 3</span>) · <span class="mono">age &gt;= 65</span> · <span class="mono">discharge status 01</span> · uppercase <span class="mono">OR</span> splits branches; shared conditions from the first branch are inherited. Codes accept a trailing <span class="mono">*</span> wildcard.</div></details></div></div>`;
};

function relGraph(highlight) {
  const cnt = {}; IX.claims.forEach(c => { const k = c.ms_drg + '>' + c.apr_drg; cnt[k] = (cnt[k] || 0) + 1; });
  let edges = Object.entries(cnt).map(([k, n]) => { const [m, a] = k.split('>'); return { m, a, n }; });
  if (!S.ui.relAll) edges = edges.filter(e => highlight.includes(e.m));
  if (!edges.length) return '<div class="mute">No paired-claim relationships for this selection.</div>';
  const ms = [...new Set(edges.map(e => e.m))].sort(), ap = [...new Set(edges.map(e => e.a))].sort();
  const H = Math.max(ms.length, ap.length) * 24 + 24, W = 660, max = Math.max(...edges.map(e => e.n));
  const y = (arr, v) => 20 + arr.indexOf(v) * ((H - 40) / Math.max(1, arr.length - 1 || 1)) + (arr.length === 1 ? (H - 40) / 2 : 0);
  const paths = edges.map(e => { const y1 = y(ms, e.m), y2 = y(ap, e.a), hl = highlight.includes(e.m); return `<path d="M150 ${y1} C 300 ${y1}, 300 ${y2}, 440 ${y2}" fill="none" stroke="${hl ? '#c27c2c' : '#9fb7c4'}" stroke-opacity="${hl ? 0.85 : 0.45}" stroke-width="${(1 + 10 * e.n / max).toFixed(1)}"><title>MS ${e.m} → APR ${e.a}: ${e.n} claims</title></path>`; }).join('');
  const node = (x, v, lab, desc, hl, anchor) => `<g><circle cx="${x}" cy="${y(anchor === 'end' ? ms : ap, v)}" r="5" fill="${hl ? '#c27c2c' : '#0f5b78'}"/><text x="${anchor === 'end' ? x - 9 : x + 9}" y="${y(anchor === 'end' ? ms : ap, v) + 4}" font-size="11.5" text-anchor="${anchor}" fill="#1c2733" font-weight="${hl ? 700 : 400}">${esc(lab)}<title>${esc(desc)}</title></text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="MS-DRG to APR-DRG relationship graph">${paths}${ms.map(m => node(150, m, 'MS ' + m, msDesc(m), highlight.includes(m), 'end')).join('')}${ap.map(a => node(440, a, 'APR ' + a + ' ' + (aprDesc(a).length > 30 ? aprDesc(a).slice(0, 29) + '…' : aprDesc(a)), aprDesc(a), false, 'start')).join('')}</svg>`;
}

    `<div class="card"><div class="row">${conceptPicker()}<label class="f">Evidence mode<select onchange="A.setCfg('useClaims',this.value==='1',true)"><option value="1" ${S.cfg.useClaims ? 'selected' : ''}>Use paired claims</option><option value="0" ${!S.cfg.useClaims ? 'selected' : ''}>Provisional only (ignore claims)</option></select></label>${evidenceBadge(cand.mode)}</div>

function heatmap(metric) {
  return memo('heat|' + metric, () => {
    const ms = [...new Set(IX.claims.map(c => c.ms_drg))].sort(), ap = [...IX.apr.keys()].sort();
    const msDx = {}, msN = {}, pair = {};
    IX.claims.forEach(c => { (msDx[c.ms_drg] = msDx[c.ms_drg] || new Set()); msDx[c.ms_drg].add(c.pdx); c.sdx.forEach(d => msDx[c.ms_drg].add(d)); msN[c.ms_drg] = (msN[c.ms_drg] || 0) + 1; pair[c.ms_drg + '|' + c.apr_drg] = (pair[c.ms_drg + '|' + c.apr_drg] || 0) + 1; });
    const val = (m, a) => metric === 'prob' ? (pair[m + '|' + a] || 0) / msN[m] : ENG.overlap(msDx[m], (IX.aprDx.get(a) || { all: new Set() }).all);
    return { ms, ap, val };
  });
}

function explain(g) {
  const c = conceptById(g.source), gi = genInfo(g), cd = g.candidate || {};
  const cand = candFor(g.source);
  const m = (g.apr && cand.orig.length) ? ENG.dxMapping(cand.orig.filter(i => IX.claims[i].apr_drg === g.apr), g.apr, IX, S.cfg) : null;
  const pres = g.condStatus.filter(s => /^(Preserved|Translated|Implicit|Partially)/.test(s.status));
  const notT = g.condStatus.filter(s => /^(Not|Approximated|Adjusted|Manual)/.test(s.status));
  const need = [];
  if (g.provisional) need.push('Obtain paired claims (or regroup a claim sample with a licensed APR-DRG grouper) to replace the provisional mapping with empirical evidence.');
  if (g.sev && g.sev.n < S.cfg.minVolume) need.push(`Increase evidence volume: only ${g.sev.n} original claims support this APR-DRG.`);
  if (gi && gi.sib > 1) need.push('SME to decide whether sibling APR concepts are deployed separately or merged, and whether low-share candidates should be dropped.');
  if (g.condStatus.some(s => /verify/.test(s.status))) need.push('Coding SME to verify diagnosis codes not observed in the APR dx dataset for this APR-DRG.');
  if (g.condStatus.some(s => /^Not directly/.test(s.status))) need.push('Clinical SME to confirm how the untranslatable CC restriction should be handled.');
  if ((g.losInfo || []).some(l => l.equivalent)) need.push('Confirm whether the LOS threshold should be preserved or re-anchored to the APR population (percentile-equivalent shown in the side-by-side view).');
  if (gi && gi.v.fi > S.cfg.maxFalseInc) need.push(`Review false inclusions (${pct(gi.v.fi)} of translated claims were not in the original population).`);

  return head('Governance & Approvals', 'Classification, versioning, SME approval workflow and full change history for every generated APR-DRG concept.') +
    `<div class="kpis">${statuses.map(s => kpi(s, stC[s] || 0)).join('')}</div>
    <div class="card"><div class="row"><label class="f">Search<input id="govQ" value="${esc(S.ui.govQ || '')}" oninput="A.ui('govQ',this.value)" style="width:180px"></label><label class="f">Status<select onchange="A.ui('govSt',this.value)"><option value="">All</option>${statuses.map(s => `<option ${s === fs ? 'selected' : ''}>${s}</option>`).join('')}</select></label><label class="f">Classification<select onchange="A.ui('govCls',this.value)"><option value="">All</option>${ENG.CLASSES.map(s => `<option ${s === fc ? 'selected' : ''}>${s}</option>`).join('')}</select></label><span style="flex:1"></span><button class="sec" onclick="A.exportGov()">Download governance log</button><button class="sec" onclick="A.exportGens()">Download generated concepts</button></div>
    <div style="margin-top:10px">${tbl('gov', [{ k: 'gid', l: 'Concept', r: r => `<a href="javascript:void 0" onclick="A.govSel('${jsa(r.gid)}')">${esc(r.gid)}</a>` }, { k: 'src', l: 'Source' }, { k: 'apr', l: 'APR-DRG' }, { k: 'cls', l: 'Classification', r: r => badge(r.cls) }, { k: 'st', l: 'Status', r: r => stBadge(r.st) }, { k: 'ver', l: 'Version' }, { k: 'ips', l: 'IPS', num: 1, r: r => pct(r.ips), sv: r => r.ips == null ? -1 : r.ips }, { k: 'created', l: 'Translation date', r: r => esc(String(r.created).slice(0, 16).replace('T', ' ')) }, { k: 'gv', l: 'APR grouper' }], rows, { h: 360, attr: r => r.gid === S.ui.govSel ? 'class="sel"' : '' })}</div></div>
    <div class="card"><h3>Detail</h3>${detail}</div>
    <div class="card"><h3>Source concepts without an active APR concept</h3>${tbl('nogen', [{ k: 'id', l: 'Concept' }, { k: 'desc', l: 'Description' }, { k: 'cls', l: 'Classification', r: r => badge(r.cls) }, { k: 'why', l: 'Reason' }], noGen)}
    ${S.removed.length ? `<h3 style="margin-top:12px">Removed concepts log</h3>${tbl('rem', [{ k: 'ts', l: 'Timestamp' }, { k: 'gid', l: 'Concept' }, { k: 'by', l: 'By' }, { k: 'note', l: 'Note' }], S.removed.slice().reverse())}` : ''}</div>`;
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
const A = {};
let renderTimer = null;
function render() {
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && ae.selectionStart;
  validSel();
  $('nav').innerHTML = VIEWS.map(([k, l], i) => `<a class="${S.view === k ? 'on' : ''}" onclick="A.nav('${k}')"><span class="n">${i + 1}</span>${esc(l)}</a>`).join('');
  try { $('main').innerHTML = V[S.view](); } catch (e) { console.error(e); $('main').innerHTML = `<div class="err">Render error: ${esc(e.message)}</div>`; }
  const anySample = Object.values(S.src).some(s => String(s).startsWith('sample'));
  $('synBadge').textContent = anySample ? 'SYNTHETIC DATA' : 'UPLOADED DATA';
  $('synBadge').style.background = anySample ? '#f2c94c' : '#9fd3c0';
  $('synLine').textContent = anySample ? 'Fictional demo data — DRG relationships, MCC/CC flags and SOI levels are not official CMS or 3M/Solventum grouper logic.' : 'All datasets uploaded by user. Results are still analytical estimates, not grouper output.';
  const el = fid ? $(fid) : null;
  if (el && el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search')) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } }
}
A.nav = v => { S.view = v; save(); render(); window.scrollTo(0, 0); };
A.setConcept = id => { S.sel.concept = id; S.sel.apr = null; S.ui.mergeSel = []; save(); render(); };
A.setApr = a => { S.sel.apr = a; render(); };
A.open = (id, v) => { S.sel.concept = id; S.sel.apr = null; A.nav(v); };
A.sort = (k, c) => { const s = S.ui.sort[k]; S.ui.sort[k] = { k: c, d: s && s.k === c ? -s.d : 1 }; render(); };
A.ui = (k, v) => { S.ui[k] = v; if (k.endsWith('Q')) { clearTimeout(renderTimer); renderTimer = setTimeout(render, 180); } else render(); };
A.setCfg = (p, v, rerender) => { const ks = p.split('.'); let o = S.cfg; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = v; touch(); if (rerender || true) render(); };
A.resetCfg = () => { S.cfg = clone(DEFAULT_CFG); touch(); render(); toast('Configuration restored to defaults.'); };
A.setW = (k, v) => { S.cfg.w[k] = Math.max(0, v || 0); touch(); render(); };
A.runAll = () => { runAll(); render(); toast('Translated ' + S.ds.concepts.length + ' concepts.'); };
A.genOne = (id, go) => {
  const ex = S.gens.filter(g => g.source === id && ['Approved', 'Pending SME review', 'Modified'].includes(g.status));
  if (ex.length && !confirm(`${ex.length} concept(s) for ${id} are approved, pending review or manually modified. Regenerating replaces them (history is retained). Continue?`)) return;
  generateFor(id); touch(); if (go) { S.sel.concept = id; S.view = 'gen'; } render(); toast('Generated APR concepts for ' + id + '.');
};
A.resetSample = () => { if (!confirm('Reset all datasets, configuration, manual edits and generated concepts to the synthetic sample?')) return; try { localStorage.removeItem(STORE_KEY); } catch (e) { } init(true); toast('Reset to synthetic sample data.'); };

/* data management */
A.template = key => { const sc = ENG.SCHEMA[key], cols = sc.req.concat(sc.opt); download(key + '_template.csv', ENG.toCSV(sample()[key].slice(0, 3), cols)); };
A.exportDs = key => { const rows = S.ds[key]; download(key + '_current.csv', ENG.toCSV(rows)); };
A.togglePreview = key => { S.ui.preview[key] = !S.ui.preview[key]; render(); };
A.upload = (key, input) => {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const p = ENG.parseCSV(String(rd.result)); const vr = ENG.validateSchema(key, p.rows, p.headers);
    if (!vr.ok) { S.ui.dsMsg[key] = { ok: false, html: `Upload of <b>${esc(f.name)}</b> rejected. ${vr.missingReq.length ? 'Missing required columns: ' + esc(vr.missingReq.join(', ')) + '.' : ''} ${!p.rows.length ? 'No data rows.' : ''}` }; render(); return; }
    S.ds[key] = p.rows; S.src[key] = 'uploaded: ' + f.name;
    if (key === 'concepts') { const ids = new Set(p.rows.map(r => r.concept_id)); S.gens = S.gens.filter(g => ids.has(g.source)); Object.keys(S.manual).forEach(k => { if (!ids.has(k)) delete S.manual[k]; }); S.ui.draft = null; }
    rebuild();
    S.ui.dsMsg[key] = { ok: true, html: `Loaded <b>${p.rows.length}</b> rows from ${esc(f.name)}.${vr.reqBlank.length ? ' Blank required values: ' + esc(vr.reqBlank.join(', ')) + '.' : ''}${vr.unknown.length ? ' Extra columns kept: ' + esc(vr.unknown.join(', ')) + '.' : ''} <button class="sm" onclick="A.runAll()">Re-run translations</button>` };
    render();
  };
  rd.readAsText(f);
};

/* repository */
A.newC = (k, v) => { S.ui.newC = S.ui.newC || {}; S.ui.newC[k] = v; };
A.addConcept = () => {
  const f = Object.assign({}, S.ui.newC || {});
  const next = 'C' + String(Math.max(0, ...S.ds.concepts.map(c => parseInt(String(c.concept_id).replace(/\D/g, '')) || 0)) + 1).padStart(3, '0');
  f.concept_id = (f.concept_id || next).trim();
  if (!f.concept_description) { toast('A description is required.'); return; }
  if (S.ds.concepts.some(c => c.concept_id === f.concept_id)) { toast('Concept ID already exists.'); return; }
  const row = {}; ENG.SCHEMA.concepts.req.concat(ENG.SCHEMA.concepts.opt).forEach(k => row[k] = f[k] || '');
  if (!row.ms_drg) { const m = row.concept_description.match(/\b\d{3}\b/g); row.ms_drg = m ? m.join(', ') : ''; }
  S.ds.concepts.push(row); S.ui.newC = null; S.src.concepts = String(S.src.concepts || 'sample').startsWith('sample') ? 'sample + user edits' : S.src.concepts;
  generateFor(row.concept_id); touch(); render(); toast('Added and translated ' + row.concept_id + '.');
};
A.delConcept = id => { if (!confirm('Delete concept ' + id + ' and its generated APR concepts?')) return; S.ds.concepts = S.ds.concepts.filter(c => c.concept_id !== id); S.gens.filter(g => g.source === id).forEach(g => S.removed.push({ ts: new Date().toISOString(), gid: g.gid, by: S.cfg.user, note: 'Source concept deleted' })); S.gens = S.gens.filter(g => g.source !== id); delete S.manual[id]; touch(); render(); };

/* decomposition */
A.editConcept = (k, v) => { const c = conceptById(S.sel.concept); c[k] = v; S.ui.draft = null; touch(); render(); };
A.reparse = () => { S.ui.draft = null; touch(); render(); toast('Description re-parsed.'); };
A.saveDraft = () => { const d = S.ui.draft; S.manual[d.id] = clone(d.groups); touch(); render(); toast('Manual override saved. Regenerate to apply it to APR concepts.'); };
A.revertParse = () => { delete S.manual[S.sel.concept]; S.ui.draft = null; touch(); render(); };
function ceGroups(t) { return t === 'draft' ? S.ui.draft.groups : S.ui.genEdit.groups; }
A.ce = (t, gi, ci, key, val) => {
  const c = ceGroups(t)[gi][ci];
  if (key === 'field') { const old = ENG.valStr(c); c.field = val; const ops = ENG.OPS[ENG.FIELDS[val].t]; if (!ops.includes(c.op)) c.op = ops[0]; c.value = ENG.strToVal(c.field, c.op, old); }
  else if (key === 'op') { const old = ENG.valStr(c); c.op = val; c.value = ENG.strToVal(c.field, c.op, old); }
  else c.value = ENG.strToVal(c.field, c.op, val);
  render();
};
A.ceAdd = (t, gi) => { ceGroups(t)[gi].push({ field: 'los', op: '<', value: 10 }); render(); };
A.ceDel = (t, gi, ci) => { ceGroups(t)[gi].splice(ci, 1); render(); };
A.ceDelGroup = (t, gi) => { ceGroups(t).splice(gi, 1); render(); };
A.ceAddGroup = t => { const g = ceGroups(t); g.push(g.length ? clone(g[0].filter(c => ['ms_drg', 'apr_drg'].includes(c.field))) : []); render(); };

/* generator */
A.openSec = (gid, k) => { S.ui.open[gid] = S.ui.open[gid] || {}; S.ui.open[gid][k] = !S.ui.open[gid][k]; render(); };
A.editGen = gid => { const g = S.gens.find(x => x.gid === gid); S.ui.genEdit = { gid, groups: clone(g.groups), note: '' }; render(); };
A.cancelGen = () => { S.ui.genEdit = null; render(); };
A.saveGen = () => {
  const e = S.ui.genEdit, g = S.gens.find(x => x.gid === e.gid); const n = $('genNote'); if (n) e.note = n.value;
  const before = ENG.groupsText(g.groups), after = ENG.groupsText(e.groups);
  if (before === after) { S.ui.genEdit = null; render(); return; }
  g.groups = clone(e.groups); g.version = ENG.bumpVersion(g.version); g.status = 'Modified'; g.manual = true;
  g.condStatus = g.condStatus.concat([{ original: 'Manual edit v' + g.version, translated: after, status: 'Manual', note: e.note || 'Conditions edited by ' + S.cfg.user + '.' }]);
  g.history.push({ ts: new Date().toISOString(), action: 'Modified', by: S.cfg.user, note: `${e.note ? e.note + ' — ' : ''}Before: ${before} | After: ${after}` });
  S.ui.genEdit = null; touch(); render(); toast('Saved as v' + g.version + '.');
};
A.removeGen = gid => { if (!confirm('Remove ' + gid + '?')) return; const g = S.gens.find(x => x.gid === gid); S.removed.push({ ts: new Date().toISOString(), gid, by: S.cfg.user, note: 'Removed (status was ' + g.status + ', v' + g.version + ')' }); S.gens = S.gens.filter(x => x.gid !== gid); S.ui.mergeSel = S.ui.mergeSel.filter(x => x !== gid); touch(); render(); };
A.mergeToggle = (gid, on) => { S.ui.mergeSel = S.ui.mergeSel.filter(x => x !== gid); if (on) S.ui.mergeSel.push(gid); render(); };
A.merge = () => {
  const gs = S.ui.mergeSel.map(id => S.gens.find(g => g.gid === id)).filter(Boolean);
  if (gs.length < 2) return; const src = gs[0].source; if (gs.some(g => g.source !== src)) { toast('Only concepts from the same source can be merged.'); return; }
  let k = 1; while (S.gens.some(g => g.gid === `G-${src}-M${k}`)) k++;
  const now = new Date().toISOString(), apr = [...new Set(gs.map(g => g.apr))].join('/');
  const m = { gid: `G-${src}-M${k}`, source: src, apr, groups: gs.flatMap(g => clone(g.groups)), provisional: gs.some(g => g.provisional), provisionalReason: gs.map(g => g.provisionalReason).find(Boolean) || '', candidate: null,
    sev: { n: gs.reduce((a, g) => a + (g.sev ? g.sev.n : 0), 0), dist: {}, flags: [], chosen: null, options: [] }, condStatus: [].concat(...gs.map(g => g.condStatus.map(s => Object.assign({}, s, { note: '[' + g.gid + '] ' + s.note })))), losInfo: [].concat(...gs.map(g => g.losInfo || [])),
    version: '1.0', status: 'Draft', created: now, grouper: gs[0].grouper, manual: true, history: [{ ts: now, action: 'Merged', by: S.cfg.user, note: 'Merged from ' + gs.map(g => g.gid + ' v' + g.version).join(', ') }] };
  gs.forEach(g => { g.status = 'Superseded'; g.history.push({ ts: now, action: 'Superseded', by: S.cfg.user, note: 'Merged into ' + m.gid }); });
  S.gens.push(m); S.ui.mergeSel = []; touch(); render(); toast('Merged into ' + m.gid + '.');
};
A.addBlank = () => {
  const src = S.sel.concept; let k = 1; while (S.gens.some(g => g.gid === `G-${src}-U${k}`)) k++;
  const cand = candFor(src), apr = cand.list.length ? cand.list[0].apr : '';
  const now = new Date().toISOString();
  const g = { gid: `G-${src}-U${k}`, source: src, apr, groups: [[{ field: 'apr_drg', op: 'in', value: apr ? [apr] : [] }]], provisional: false, provisionalReason: '', candidate: null, sev: null,
    condStatus: [{ original: '—', translated: 'User-defined concept', status: 'Manual', note: 'Created manually by ' + S.cfg.user + '; no engine evidence.' }], losInfo: [], version: '1.0', status: 'Draft', created: now,
    grouper: { ms: '', apr: apr ? (IX.apr.get(apr) || {}).grouper_version || '' : '' }, manual: true, history: [{ ts: now, action: 'Created manually', by: S.cfg.user, note: '' }] };
  S.gens.push(g); S.ui.genEdit = { gid: g.gid, groups: clone(g.groups), note: '' }; touch(); render();
};
A.customSoi = (key, s, on) => { S.ui.customSoi = S.ui.customSoi || {}; const c = S.ui.customSoi[key] || (() => { const sa = currentSev(); return { soi: sa.chosen.soi.slice(), drv: sa.chosen.driver ? sa.chosen.driver.op + sa.chosen.driver.value : '' }; })(); c.soi = c.soi.filter(x => x !== s); if (on) c.soi.push(s); c.soi.sort(); S.ui.customSoi[key] = c; render(); };
A.customDrv = (key, v) => { S.ui.customSoi = S.ui.customSoi || {}; const c = S.ui.customSoi[key] || (() => { const sa = currentSev(); return { soi: sa.chosen.soi.slice(), drv: '' }; })(); c.drv = v; S.ui.customSoi[key] = c; render(); };
function currentSev() { const c = conceptById(S.sel.concept), base = ENG.translateBase(c, S.sel.apr, IX, S.cfg, S.manual); return ENG.severityAnalysis(c, S.sel.apr, base, IX, S.cfg, S.manual); }
A.applySoi = (gid, key) => {
  const g = S.gens.find(x => x.gid === gid), cs = (S.ui.customSoi || {})[key]; if (!g) return;
  const sa = currentSev(); const c = cs || { soi: sa.chosen.soi, drv: sa.chosen.driver ? sa.chosen.driver.op + sa.chosen.driver.value : '' };
  if (!c.soi.length) { toast('Select at least one SOI level.'); return; }
  const before = ENG.groupsText(g.groups);
  g.groups = g.groups.map(gr => { const ng = gr.filter(k => !['soi', 'soi_drivers'].includes(k.field)); ng.push({ field: 'soi', op: 'in', value: c.soi.slice() }); const m = (c.drv || '').match(/(>=|=)(\d+)/); if (m) ng.push({ field: 'soi_drivers', op: m[1], value: +m[2] }); return ng; });
  g.version = ENG.bumpVersion(g.version); g.status = 'Modified';
  g.history.push({ ts: new Date().toISOString(), action: 'Severity modified', by: S.cfg.user, note: `SOI set to ${c.soi.join(',')}${c.drv ? ', SOI-level dx count ' + c.drv : ''}. Before: ${before}` });
  touch(); render(); toast('Applied to ' + gid + ' (v' + g.version + ').');
};

/* validation / perf / governance */
A.setValScope = v => { S.sel.valScope = v; render(); };
A.govSel = gid => { S.ui.govSel = gid; render(); };
A.gov = (gid, st) => { const g = S.gens.find(x => x.gid === gid), n = ($('govNote') || {}).value || ''; g.history.push({ ts: new Date().toISOString(), action: st === 'Pending SME review' ? 'Submitted for SME review' : st, by: S.cfg.user, note: n }); g.status = st; touch(); render(); toast(gid + ': ' + st + '.'); };
A.modifyFromGov = gid => { const g = S.gens.find(x => x.gid === gid); S.sel.concept = g.source; S.view = 'gen'; S.ui.genEdit = { gid, groups: clone(g.groups), note: '' }; save(); render(); };

/* exports */
A.exportGens = () => {
  const rows = S.gens.map(g => { const gi = genInfo(g), c = conceptById(g.source) || {}; return { generated_concept_id: g.gid, source_concept_id: g.source, source_description: c.concept_description, apr_drg: g.apr, apr_description: g.apr && !g.apr.includes('/') ? aprDesc(g.apr) : '', conditions: ENG.groupsText(g.groups), conditions_json: JSON.stringify(g.groups), evidence: g.provisional ? 'provisional' : 'empirical', evidence_claims: g.sev ? g.sev.n : '', classification: gi ? gi.cls : '', status: g.status, version: g.version, translation_date: g.created, grouper_ms: g.grouper.ms, grouper_apr: g.grouper.apr, coverage: gi ? gi.v.cov.toFixed(4) : '', false_inclusion: gi ? gi.v.fi.toFixed(4) : '', intent_preservation_score: gi ? gi.v.ips.toFixed(4) : '', untranslated_conditions: g.condStatus.filter(s => /^Not/.test(s.status)).map(s => s.original).join('; '), data_label: 'SYNTHETIC/PoC — not grouper output' }; });
  download('generated_apr_concepts.csv', ENG.toCSV(rows));
};
A.exportVal = () => {
  const rows = S.ds.concepts.map(c => { const s = srcSummary(c.concept_id), v = s.sv; return { concept_id: c.concept_id, ms_drg: c.ms_drg, description: c.concept_description, intent: s.P.intent, apr_concepts: s.act.map(g => g.gid).join('; '), original_claims: v.nO, translated_claims: v.nT, overlap_claims: v.inter, coverage: v.cov.toFixed(4), false_inclusion_rate: v.fi.toFixed(4), false_exclusion_rate: v.fe.toFixed(4), concept_overlap_jaccard: v.jac.toFixed(4), clinical_alignment: (v.clinical || 0).toFixed(4), diagnosis_alignment: (v.dx || 0).toFixed(4), severity_alignment: (v.sev || 0).toFixed(4), claim_attribute_alignment: (v.attr || 0).toFixed(4), intent_preservation_score: (v.ips || 0).toFixed(4), weights: JSON.stringify(S.cfg.w), classification: s.cls, governance_status: s.st }; });
  download('translation_validation_report.csv', ENG.toCSV(rows));
};
A.exportPerf = () => {
  if (!IX.hasOutcomes) { toast('No outcome data available.'); return; }
  const rows = S.ds.concepts.map(c => { const v = srcVal(c.concept_id), a = ENG.perf(v.O, IX), b = ENG.perf(v.T, IX); const r = { concept_id: c.concept_id }; ['volume', 'audited', 'findings', 'hit', 'overpay', 'dpf', 'sme', 'overturn', 'opportunity'].forEach(k => { r['original_' + k] = a[k] == null ? '' : a[k]; r['translated_' + k] = b[k] == null ? '' : b[k]; }); return r; });
  download('pi_performance_comparison.csv', ENG.toCSV(rows));
};
A.exportGov = () => {
  const rows = []; S.gens.forEach(g => g.history.forEach(h => rows.push({ generated_concept_id: g.gid, source_concept_id: g.source, current_status: g.status, current_version: g.version, timestamp: h.ts, action: h.action, by: h.by, note: h.note })));
  S.removed.forEach(r => rows.push({ generated_concept_id: r.gid, source_concept_id: '', current_status: 'Removed', current_version: '', timestamp: r.ts, action: 'Removed', by: r.by, note: r.note }));
  download('governance_log.csv', ENG.toCSV(rows));
};

/* ---------------- init ---------------- */
function init(force) {
  if (force || !load()) {
    S.ds = clone(sample()); S.src = { ms: 'sample', apr: 'sample', concepts: 'sample', aprdx: 'sample', claims: 'sample' };
    S.cfg = clone(DEFAULT_CFG); S.manual = {}; S.gens = []; S.genReason = {}; S.removed = []; S.view = 'overview'; S.sel = { concept: 'C001', apr: null, valScope: 'union' };
    S.ui = { sort: {}, open: {}, mergeSel: [], dsMsg: {}, preview: {} };
    IX = ENG.prepare(S.ds); MEMO = new Map(); runAll();
  } else { IX = ENG.prepare(S.ds); MEMO = new Map(); }
  render();
}
init();

</script>
</body>
