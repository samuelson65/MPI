  --r:4px; --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif; --mono:var(--cond);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[data-go]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
.mono{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600}
h2{font-family:var(--cond);font-size:28px;font-weight:600;letter-spacing:-.005em;line-height:1.1}
h3{font-family:var(--cond);font-size:17px;font-weight:600;color:var(--text)}
h4{font-size:15px;font-weight:600}

#banner{background:var(--banner-bg);color:var(--banner-ink);font-size:13px;padding:6px 20px;display:flex;gap:12px;align-items:center}
#banner b{font-family:var(--cond);font-size:14px;letter-spacing:.02em}
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav.side{background:var(--side);padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:0 18px 20px}
.brand .mark{width:34px;height:34px;display:grid;place-items:center}
.brand .t1{font-family:var(--cond);font-weight:600;font-size:20px;line-height:1}
.brand .t2{font-size:12px;color:var(--dim);margin-top:2px}
.navsec{font-size:12px;color:var(--dim);padding:16px 18px 6px;font-weight:500}
.navi{display:flex;align-items:center;gap:10px;padding:7px 18px 7px 15px;color:var(--muted);cursor:pointer;font-size:14px;border-left:3px solid transparent}
.navi:hover{color:var(--text);background:color-mix(in srgb, var(--text) 4%, transparent)}
.navi.on{color:var(--text);border-left-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent)}
.navi .k{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--dim);width:14px;text-align:center}
.navi.on .k{color:var(--accent)}
.navi .badge{margin-left:auto;font-family:var(--cond);font-size:13px;min-width:20px;text-align:center;border-radius:2px;background:var(--crit);color:#fff}
main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 95%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fl{display:flex;flex-direction:column;gap:2px}
.fl label{font-size:12px;color:var(--dim)}
.sel,.inp{background:var(--surface);border:1px solid var(--line2);border-radius:3px;padding:5px 8px;min-width:0;outline:none}
.sel:focus,.inp:focus{border-color:var(--accent)}
.sel{max-width:170px}
.spacer{flex:1}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:3px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{background:transparent}
.crumbs{padding:14px 24px 0;color:var(--muted);font-size:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--text)} .crumbs .sep{color:var(--dim)}
.crumbs .cur{color:var(--text)}
.view{padding:12px 24px 64px}
.vh{display:flex;align-items:flex-end;gap:16px;margin:6px 0 16px;flex-wrap:wrap}
.vh p{margin:6px 0 0;color:var(--muted);max-width:72ch;font-size:14.5px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,3fr)} .g-64{grid-template-columns:minmax(0,6fr) minmax(0,4fr)} .g-37{grid-template-columns:minmax(0,3fr) minmax(0,7fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 16px;min-width:0}
.panel.flush{padding:0}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph .sub{color:var(--dim);font-size:13px}
.ph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.explain{font-size:13px;color:var(--muted);border-left:2px solid var(--line2);padding:2px 0 2px 10px;margin-top:10px;max-width:90ch}

/* board readout (figures) */
.strip{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.strip .grp{display:flex;flex:auto;border-right:1px solid var(--line);position:relative;padding-top:22px}
.strip .grp:last-child{border-right:0}
.strip .gl{position:absolute;top:7px;left:16px;font-size:12px;color:var(--dim)}
.strip .m{padding:2px 12px 12px;flex:auto}
.strip .m.click{cursor:pointer}.strip .m.click:hover .v{color:var(--accent)}
.strip .v{font-family:var(--cond);font-size:30px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.strip .l{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:1px;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:2px;font-size:13px;border:1px solid var(--line2);white-space:nowrap}
.s-0{color:var(--ok)} .s-1{color:var(--mon)} .s-2{color:var(--att)} .s-3{color:var(--crit)} .s-na{color:var(--muted)}
.bg-0{background:var(--ok)} .bg-1{background:var(--mon)} .bg-2{background:var(--att)} .bg-3{background:var(--crit)} .bg-na{background:var(--na)}
.pill.s-0{background:var(--ok-s);border-color:transparent}.pill.s-1{background:var(--mon-s);border-color:transparent}.pill.s-2{background:var(--att-s);border-color:transparent}.pill.s-3{background:var(--crit-s);border-color:transparent}
.tag{font-size:12.5px;padding:0 7px;border-radius:2px;background:var(--surface3);color:var(--muted);white-space:nowrap}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;font-size:12.5px;color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.rowlink{cursor:pointer}.tbl tr.rowlink:hover td{background:var(--surface2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.dimrow td{color:var(--dim)}
.scroll{overflow:auto}

/* ===== flight strips: the signature element ===== */
.matrix{display:grid;gap:0;border-top:1px solid var(--line2)}
.matrix>div{padding:7px 8px;min-height:46px;border-bottom:1px solid var(--line)}
.matrix .mh{font-family:var(--cond);font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line2);min-height:38px}
.matrix .mh .dot{width:10px;height:10px}
.matrix .rh{display:flex;flex-direction:column;justify-content:center}
.matrix .rh .c{font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.1}
.matrix .cell .chip{min-width:0}
.matrix .rh .s{font-size:12.5px;color:var(--muted)}
.matrix .cell{display:flex;flex-direction:column;gap:4px;justify-content:center}
.matrix .gap{justify-content:center}
.matrix .gap span{border:1px dashed var(--line2);border-radius:2px;padding:6px 10px;color:var(--dim);font-size:12.5px}
.chip{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;background:var(--strip);color:var(--strip-ink);border-radius:2px;cursor:pointer;font-size:13.5px;min-height:34px;overflow:hidden;box-shadow:inset 7px 0 0 var(--band,var(--accent));transition:transform .12s ease}
.chip:hover{transform:translateX(3px)}
.chip .cs{padding:4px 8px 4px 15px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.chip .cs b{font-family:var(--cond);font-weight:600;font-size:14.5px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cs small{font-size:11.5px;color:var(--strip-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{font-family:var(--cond);font-weight:600;font-size:15px;padding:0 8px;display:flex;align-items:center;border-left:1px solid color-mix(in srgb, var(--strip-ink) 18%, transparent);font-variant-numeric:tabular-nums}
.chip .sq{width:12px;align-self:stretch}
.tbl.strips{border-collapse:separate;border-spacing:0 5px;padding:0 12px}
.tbl.strips th{background:transparent;border-bottom:0;padding-bottom:2px}
.tbl.strips td{background:var(--strip);color:var(--strip-ink);border:0;padding:7px 10px}
.tbl.strips td:first-child{box-shadow:inset 7px 0 0 var(--band,var(--accent));padding-left:18px;border-radius:2px 0 0 2px;font-family:var(--cond);font-weight:600;font-size:15px;white-space:nowrap}
.tbl.strips td:last-child{border-radius:0 2px 2px 0}
.tbl.strips .muted,.tbl.strips .dim{color:var(--strip-dim)}
.tbl.strips .tag{background:color-mix(in srgb, var(--strip-ink) 9%, transparent);color:var(--strip-ink)}
.tbl.strips tr.rowlink:hover td{background:color-mix(in srgb, var(--strip) 88%, var(--accent))}
.tbl.strips .pill{border-color:transparent}
.tbl.strips .pill.s-0{background:var(--ok);color:#fff}.tbl.strips .pill.s-1{background:var(--mon);color:var(--strip-ink)}.tbl.strips .pill.s-2{background:var(--att);color:#fff}.tbl.strips .pill.s-3{background:var(--crit);color:#fff}
.tbl.strips .pill .dot{display:none}
.tbl.strips .pill.s-na{background:color-mix(in srgb, var(--strip-ink) 10%, transparent);color:var(--strip-ink)}

/* pipeline */
.pipe{display:flex;gap:3px}
.pipe .stg{flex:1;position:relative;padding:10px 8px 10px 18px;background:var(--surface2);cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);min-width:0}
.pipe .stg:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:12px}
.pipe .stg:hover{background:var(--surface3)}
.pipe .n{font-family:var(--cond);font-size:30px;font-weight:500;line-height:1}
.pipe .lb{font-size:12px;letter-spacing:-.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .bar{height:3px;margin-top:8px;background:var(--accent)}

.hb{display:grid;grid-template-columns:130px 1fr 64px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hb .track{height:10px;background:var(--surface2);display:flex;overflow:hidden}
.hb .track>span{height:100%}
.hb .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hb .val{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--cond);font-size:15px}

.ins{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ins:last-child{border-bottom:0}
.ins .ic{width:4px;border-radius:1px;flex:none;align-self:stretch;font-size:0!important;background:currentColor!important}
.ins .why{font-size:12.5px;color:var(--dim);margin-top:2px}
.ins a{color:var(--text);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.ins a:hover{text-decoration-color:var(--accent)}

.hs{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.comp{display:grid;grid-template-columns:1fr 40px;gap:2px 8px;margin:8px 0;font-size:13px}
.comp .num{font-family:var(--cond);font-size:16px}
.comp .bar{grid-column:1/3;height:5px;background:var(--surface2);overflow:hidden}
.comp .bar span{display:block;height:100%;background:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:'+ ';color:var(--accent)} details[open] summary:before{content:'− '}

.tree{font-size:14px}
.tree .node{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:2px;cursor:pointer}
.tree .node:hover{background:var(--surface2)}
.tree .node.on{background:var(--accent-soft)}
.tree .node .ct{margin-left:auto;font-size:12.5px;color:var(--dim)}
.tree .kids{margin-left:14px;border-left:1px solid var(--line);padding-left:6px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line2);margin:14px 0 16px;overflow:auto}
.tab{padding:9px 16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--cond);font-size:16px;font-weight:500}
.tab:hover{color:var(--text)} .tab.on{color:var(--text);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px}
.kv .k{font-size:12.5px;color:var(--dim)}
.kv .v{font-size:14px;margin-top:1px}
.dna{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.dna-strip{display:flex;height:8px;overflow:hidden;margin-top:6px;gap:2px}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);overflow:hidden}
.dates>div{background:var(--surface);padding:8px 10px}
.dates .k{font-size:12.5px;color:var(--dim)}
.dates .v{font-family:var(--cond);font-size:16px;margin-top:2px}

.evo{display:flex;align-items:stretch;overflow:auto;padding-bottom:4px}
.evo .vn{min-width:170px;flex:1;padding:10px 12px 10px 16px;background:var(--strip);color:var(--strip-ink);border-radius:2px;cursor:pointer;box-shadow:inset 6px 0 0 var(--s0)}
.evo .vn.on{box-shadow:inset 6px 0 0 var(--accent),0 0 0 2px var(--accent)}
.evo .vn .dim,.evo .vn .mini{color:var(--strip-dim)}
.evo .vn .tag{background:color-mix(in srgb, var(--strip-ink) 9%, transparent);color:var(--strip-ink)}
.evo .vn .vl{font-family:var(--cond);font-size:22px;font-weight:600}
.evo .ar{display:grid;place-items:center;color:var(--dim);padding:0 6px;font-size:16px}
.evo .mini{display:grid;grid-template-columns:1fr auto;font-size:12.5px;gap:1px 8px;margin-top:6px}
.evo .mini b{color:var(--strip-ink);font-weight:600;font-variant-numeric:tabular-nums}
.evo .vn .delta-up{color:color-mix(in srgb, var(--ok) 70%, var(--strip-ink))}
.delta-up{color:var(--ok)} .delta-dn{color:var(--crit)}

.chk{display:grid;grid-template-columns:18px 1fr auto;gap:6px 8px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}

#drawer{position:fixed;top:0;right:0;width:min(700px,100vw);height:100vh;background:var(--surface);border-left:1px solid var(--line2);z-index:50;transform:translateX(102%);transition:transform .22s ease;overflow:auto;padding:20px 22px 40px;box-shadow:-20px 0 40px rgba(0,0,0,.3)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:color-mix(in srgb, var(--bg) 55%, transparent);z-index:40;display:none}
#scrim.open{display:block}
#tip{position:fixed;pointer-events:none;z-index:99;background:var(--surface3);color:var(--text);border:1px solid var(--line2);border-radius:3px;padding:7px 10px;font-size:13px;max-width:320px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#tip .tt{color:var(--muted);font-size:12px;margin-bottom:3px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cal>div{background:var(--surface);min-height:86px;padding:5px 6px;font-size:12px}
.cal .dh{min-height:auto;background:var(--surface2);color:var(--dim);padding:6px;font-size:12.5px}
.cal .out{background:var(--surface2);opacity:.5}
.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{color:var(--dim);font-family:var(--cond);font-size:14px}
.cal .ev{display:block;margin-top:3px;padding:1px 5px 1px 7px;border-radius:1px;background:var(--strip);color:var(--strip-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 3px 0 0 var(--accent)}
.lists{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.li:hover{color:var(--accent)}
.li:last-child{border-bottom:0}
.lists h3{font-size:16px}

.cmp td.nc{color:var(--dim);font-style:italic}
.cbar{height:5px;background:var(--accent);margin-top:4px}
.badge-c{font-size:12px;padding:0 6px;border-radius:2px;white-space:nowrap}
.badge-c.y{background:var(--ok-s);color:var(--ok)} .badge-c.n{background:var(--surface3);color:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;gap:6px;align-items:center;padding:4px 6px 4px 14px;border-radius:2px;background:var(--strip);color:var(--strip-ink);font-size:13.5px;box-shadow:inset 6px 0 0 var(--band,var(--accent))}
.pchip .dot{display:none}
.pchip button{background:none;border:0;color:var(--strip-dim);cursor:pointer;padding:0 4px}

.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thr input{width:74px;background:var(--surface2);border:1px solid var(--line2);border-radius:3px;padding:3px 6px;text-align:right}
.empty{padding:40px;text-align:center;color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
svg text{font-family:var(--font)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--strip);color:var(--strip-ink);box-shadow:inset 6px 0 0 var(--accent),0 8px 24px rgba(0,0,0,.3);padding:10px 18px 10px 22px;border-radius:2px;z-index:100;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface2);cursor:pointer}
.rcard:hover{border-color:var(--line2)}
.why-list{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
.why-list li{margin:2px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface3);padding:1px 5px;border-radius:2px}

/* appearance editor */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th-card{border:1px solid var(--line2);border-radius:3px;padding:8px;cursor:pointer;background:var(--surface2)}
.th-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th-card .pv{border-radius:2px;padding:8px;display:grid;gap:4px}
.th-card .pv i{display:block;height:12px;border-radius:1px}
.th-card .nm{font-family:var(--cond);font-weight:600;font-size:16px;margin-top:6px}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 14px;margin-top:8px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px}
.sw input[type=color]{width:32px;height:26px;border:1px solid var(--line2);border-radius:2px;padding:0;background:none;cursor:pointer}
.sw code{background:none;padding:0;color:var(--dim)}


/* data entry grid */
.etool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.etool .seg button{font-family:var(--cond);font-size:15px;font-weight:500;padding:5px 14px}
.etool .seg button .dim{font-size:13px;margin-left:3px}
.etool .seg button.on .dim{color:inherit;opacity:.7}
.btn.arm{border-color:var(--crit);color:var(--crit)}
.egrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.sheetwrap{overflow:auto;max-height:calc(100vh - 290px);min-height:240px;border:1px solid var(--line2);border-radius:3px;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13.5px;width:max-content;min-width:100%}
.sheet th{position:sticky;top:0;z-index:3;background:var(--surface2);font-weight:500;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap}
.sheet th .rq{color:var(--accent);margin-left:2px}
.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:31px}
.sheet .gc{display:block;width:100%;height:30px;background:transparent;border:0;padding:0 8px;outline:none;color:var(--text);font-variant-numeric:tabular-nums}
.sheet .gc::-webkit-calendar-picker-indicator{opacity:.35}
.sheet .gc:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.sheet .gc.bad{background:var(--crit-s);box-shadow:inset 0 0 0 1px var(--crit)}
.sheet .gc.bad:focus{box-shadow:inset 0 0 0 2px var(--crit)}
.sheet .gc.warn{box-shadow:inset 0 -2px 0 var(--mon)}
.sheet .rn{position:sticky;left:0;z-index:2;background:var(--surface2);color:var(--dim);text-align:right;padding:0 8px;font-family:var(--cond);font-size:13px;width:40px;min-width:40px;max-width:40px}
.sheet td.fz,.sheet th.fz{position:sticky;left:40px;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line2)}
.sheet th.fz{z-index:4;background:var(--surface2)}
.sheet thead .rn{z-index:4}
.sheet td.rn:last-child,.sheet th.rn:last-child{position:static;text-align:center;padding:0 4px}
.sheet .dv,.sheet .dvh{background:color-mix(in srgb, var(--accent) 5%, var(--surface));color:var(--muted);white-space:nowrap;padding:0 10px}
.sheet .dvh{background:color-mix(in srgb, var(--accent) 9%, var(--surface2));color:var(--text)}
.sheet .dv.first,.sheet .dvh.first{border-left:2px solid var(--accent)}
.sheet .dv a{color:var(--text);font-family:var(--cond);font-weight:600;font-size:14px}
.rowx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:2px}
.rowx:hover{color:var(--crit);background:var(--crit-s)}
.eside{position:sticky;top:80px}
.ekv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 8px}
.ekv div{display:flex;flex-direction:column}
.ekv b{font-family:var(--cond);font-size:26px;font-weight:500;line-height:1}
.ekv span{font-size:12px;color:var(--muted)}
.eiss{cursor:pointer;font-size:13px}
.eiss .dot{vertical-align:1px}
@media (max-width:1100px){.egrid{grid-template-columns:1fr}.eside{position:static}}

/* history, actions, brief */
.hist{display:flex;gap:2px;align-items:center}
.hist span{height:14px;border-radius:1px;flex:none}
.hist.axis span{height:auto;font-size:10.5px;color:var(--dim);font-family:var(--cond);overflow:visible;white-space:nowrap}
.histgrid{display:grid;grid-template-columns:minmax(150px,240px) auto;gap:4px 14px;align-items:center;overflow:auto}
.histgrid .hl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--muted)}
.histgrid .hl:hover{color:var(--text)}
.aform{display:grid;grid-template-columns:1fr 1.6fr 1fr 140px auto;gap:6px;margin-top:10px}
#drawer .aform{grid-template-columns:1fr 1fr}
#drawer .aform #acText{grid-column:1/3}
.brief{max-width:1000px}
.brief .bh h2{font-size:30px}
.btn:disabled{opacity:.45;cursor:default}
@media print{
  html:root{--bg:#fff!important;--side:#fff!important;--surface:#fff!important;--surface2:#f2f4f3!important;--surface3:#e7ebe9!important;--line:#d9dfdc!important;--line2:#b8c1bd!important;--text:#121a18!important;--muted:#47534f!important;--dim:#6b7672!important;--strip:#f5f0df!important;--strip-ink:#121a18!important;--strip-dim:#47534f!important;--accent:#a8640f!important}
  html,body{background:#fff!important}
  nav.side,.topbar,.crumbs,#banner,.noprint,#tip,#drawer,#scrim,.toast{display:none!important}
  html,body{font-size:11.5px}.shell{display:block}.view{padding:0}.panel{break-inside:avoid;padding:8px 10px}.ph{margin-bottom:6px}.brief .bh h2{font-size:22px}h3{font-size:14px}.ekv b{font-size:20px!important}.tbl{font-size:11px}.why-list,.ins{font-size:11.5px!important}.grid[style*=margin-top],.panel[style*=margin-top]{margin-top:7px!important}
  .brief{max-width:none}.grid{gap:8px}.g3{grid-template-columns:repeat(3,1fr)!important}.g2{grid-template-columns:1fr 1fr!important}
  .tbl td,.tbl th{padding:4px 6px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:10mm}
}
@media (max-width:760px){.aform{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1100px){.g-73,.g-64,.g-37,.g3{grid-template-columns:1fr}.lists{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr} nav.side{position:static;height:auto;display:flex;overflow:auto;padding:6px 8px;gap:2px}
  .brand,.navsec{display:none} .navi{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.navi.on{border-bottom-color:var(--accent)}
  .g2{grid-template-columns:1fr} .lists{grid-template-columns:1fr} .topbar{padding:8px 12px} .view{padding:12px 12px 50px}
  .hs,.dna{grid-template-columns:1fr} .sel{max-width:130px} h2{font-size:24px}
}
</style>
</head>
<body>
<div id="banner" style="display:none"></div>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main>
    <div class="topbar" id="topbar"></div>
    <div class="crumbs" id="crumbs"></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim"></div><div id="drawer"></div><div id="tip"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.json,.csv" multiple style="display:none">

const PM_LABEL = { pr_auc: 'PR-AUC', f1: 'F1', roc_auc: 'ROC-AUC', recall: 'Recall', precision: 'Precision' };

/* ---------- portfolio health score (transparent) ---------- */
function portfolioScore(ms) {

    { k: 'Monitoring signals clear', v: monitoring, w: w.monitoring, how: `${monOk} of ${prod.length} models have no drift / missing-data / data-quality rule at Attention or worse.` },
    { k: 'Deployment & scoring reliability', v: reliability, w: w.reliability, how: `Average of deployments without rollback in the last 12 months (${deps - rbs}/${deps || 0}) and share of models with scoring failures below ${F.pct(failThr)} (${F.pct(scoreOk, 0)}).` },
  ] };
}

/* ---------- training data sufficiency ---------- */
function sufficiency(m, v) {
  if (!v) return null;
  const c = { rec: cfgVal('suff_min_records', 100000), pos: cfgVal('suff_min_positives', 5000), rate: cfgVal('suff_min_pos_rate', .01), mon: cfgVal('suff_min_months', 12), age: cfgVal('suff_max_age_days', 365) };
  const pos = +v.positive_cases || 0, tot = +v.training_records || 0;
  const months = v.training_window_start && v.training_window_end ? Math.round(days(v.training_window_start, v.training_window_end) / 30.4) : null;
  const endD = v.training_window_end || v.train_date; const age = endD ? days(endD, evalDate()) : null;
  const checks = [
    { k: 'Training records', ok: tot >= c.rec, obs: F.int(tot), need: '≥ ' + F.int(c.rec) },
    { k: 'Positive / finding cases', ok: pos >= c.pos, obs: F.int(pos), need: '≥ ' + F.int(c.pos) },
    { k: 'Positive class rate', ok: tot ? pos / tot >= c.rate : false, obs: tot ? F.pct(pos / tot, 2) : '—', need: '≥ ' + F.pct(c.rate) },
    { k: 'Months of claims history', ok: months == null ? null : months >= c.mon, obs: months == null ? '—' : months + ' mo', need: '≥ ' + c.mon + ' mo' },
    { k: 'Age of newest training data', ok: age == null ? null : age <= c.age, obs: age == null ? '—' : age + ' d', need: '≤ ' + c.age + ' d' },
  ];
  const fails = checks.filter(x => x.ok === false).length;
  return { checks, verdict: fails === 0 ? 'Sufficient' : fails === 1 ? 'Marginal' : 'Insufficient', sev: fails === 0 ? 0 : fails === 1 ? 1 : 2 };
}

/* ---------- retraining opportunity radar ---------- */
function radarSignals(m) {
  if (!m.isProd) return null;
  const sr = stalenessRatio(m) ?? 0;
  const lastMon = m.mon.filter(r => r.period <= S.to);
  const lm = lastMon[lastMon.length - 1] || {};
  const pv = m.prod;
  const ltd = lastTrain(m);
  const newClaims = sum(m.impact.filter(r => r.period <= S.to && periodEnd(r.period) > toDate(ltd)).map(r => r.claims_scored));
  const trainRecs = +pv.training_records || 1;
  const perfR = m.health.rules.find(r => r.rule.signal === 'perf_drop_pct');
  const drop = perfR && perfR.value != null ? perfR.value : 0;
  const base = lastMon.slice(0, 3);
  const predShift = +lm.prediction_psi || 0;
  const sig = [
    { k: 'Data age', v: clamp(sr / 1.5, 0, 1), why: `${Math.round(sr * 100)}% of the ${m.retrain_cadence_days}-day cadence elapsed`, raw: sr >= 0.85 },
    { k: 'New claims', v: clamp(newClaims / trainRecs / 0.6, 0, 1), why: `${F.big(newClaims)} claims scored since last training (${F.pct(newClaims / trainRecs, 0)} of training volume)`, raw: newClaims / trainRecs >= 0.3 },
    { k: 'New codes', v: clamp((+lm.new_code_rate || 0) / 0.15, 0, 1), why: `${F.pct(+lm.new_code_rate || 0)} of scored claims carry codes unseen in training`, raw: (+lm.new_code_rate || 0) >= 0.05 },
    { k: 'Perf. decline', v: clamp(drop / 0.2, 0, 1), why: `${F.pct(drop)} below validated baseline`, raw: drop >= 0.05 },
    { k: 'Feature drift', v: clamp((+lm.max_feature_psi || 0) / 0.3, 0, 1), why: `max feature PSI ${F.n3(+lm.max_feature_psi || 0)}${lm.features_drifted ? `, ${lm.features_drifted} features drifted` : ''}`, raw: (+lm.max_feature_psi || 0) >= 0.1 },
    { k: 'Dist. shift', v: clamp(predShift / 0.3, 0, 1), why: `score-distribution PSI ${F.n3(predShift)} vs validation`, raw: predShift >= 0.1 },
  ];
  const score = avg(sig.map(s => s.v));
  return { sig, score, reasons: sig.filter(s => s.raw) };
}

/* ---------- portfolio intelligence ---------- */
function portfolioIntel(ms) {
  const out = [];
  const prod = ms.filter(m => m.isProd);
  const byP = groupBy(prod, m => m.program_id);
  const ratio = cfgVal('large_dataset_ratio', 1.5);
  for (const [pid, arr] of Object.entries(byP)) {
    if (arr.length < 2) continue;
    const med = median(arr.map(m => +m.prod.training_records));
    const medPerf = median(arr.map(m => metricVal(m, pmOf(m))));
    for (const m of arr) {
      const rec = +m.prod.training_records;
      if (rec >= ratio * med) out.push({ type: 'Large training set', sev: 0, m, text: `${m.label} trains on ${F.big(rec)} records — ${(rec / med).toFixed(1)}× the ${M.progById[pid].program_name} median (${F.big(med)}).` });
      if (rec < med && medPerf != null && metricVal(m, pmOf(m)) >= medPerf) out.push({ type: 'Efficient performer', sev: 0, m, text: `${m.label} reaches ${PM_LABEL[pmOf(m)] || pmOf(m)} ${F.n3(metricVal(m, pmOf(m)))} (≥ program median ${F.n3(medPerf)}) with ${F.big(rec)} records, below the median ${F.big(med)}.` });
    }
  }
  const tp = cfgVal('trend_periods', 3);
  for (const m of prod) {
    const r = m.health.rules.find(x => x.rule.signal === 'recall_decline_periods');
    if (r && r.value >= tp) out.push({ type: 'Declining performance', sev: 2, m, text: `${m.label}: recall down ${r.value} consecutive periods (${r.extra}).` });
    const tEnd = m.prod.training_window_end || m.prod.train_date; const age = tEnd ? days(tEnd, evalDate()) : null;
    if (age != null && age > cfgVal('suff_max_age_days', 365)) out.push({ type: 'Outdated training data', sev: 1, m, text: `${m.label}: newest training data ends ${F.date(tEnd)} (${age} days old).` });
  }
  const activeClients = uniq(ms.map(m => m.client_id));
  for (const p of M.programs) {
    const cov = uniq(prod.filter(m => m.program_id === p.program_id).map(m => m.client_id)).length;
    if (activeClients.length && cov / activeClients.length < 0.5) out.push({ type: 'Limited coverage', sev: 1, text: `${p.program_name}: production models for ${cov} of ${activeClients.length} active clients.` });
  }
  const fam = groupBy(ms.flatMap(m => m.feats.filter(f => !f.removed_in_version).map(f => ({ f: f.feature_name, fam: m.program.program_family || m.program_id, c: m.client_id, m: m.model_id }))), x => x.fam + '|' + x.f);
  const shared = Object.entries(fam).map(([k, a]) => ({ k, fam: k.split('|')[0], f: k.split('|')[1], clients: uniq(a.map(x => x.c)).length, models: uniq(a.map(x => x.m)).length })).filter(x => x.clients >= 3).sort(by('models', -1));
  const byFam = groupBy(shared, x => x.fam);
  for (const [f, arr] of Object.entries(byFam)) out.push({ type: 'Standardization opportunity', sev: 0, text: `${f}: ${arr.length} features are engineered independently in ${Math.max(...arr.map(a => a.models))} models across ${Math.max(...arr.map(a => a.clients))} clients (e.g. ${arr.slice(0, 3).map(a => a.f).join(', ')}) — candidates for a shared feature-store definition.` });
  return out;
}

/* ---------- executive insights (derived, never hardcoded) ---------- */
function insights(ms) {
  const out = []; const ed = evalDate();
  const push = (sev, text, why, mid) => out.push({ sev, text, why, mid });
  // 1 critical / attention drivers
  for (const m of ms.filter(m => m.isProd && m.health.status >= 2)) {
    const d = m.health.drivers[0];
    push(m.health.status, `<a data-go="model/${m.model_id}/health">${esc(m.label)}</a> is <b>${STATUS[m.health.status]}</b>: ${esc(d.rule.rule_name.toLowerCase())} at ${F.by(d.rule.unit, d.value)} (threshold ${F.by(d.rule.unit, d.rule[['', 'monitor', 'attention', 'critical'][d.sev]])}).`,
      `${m.health.drivers.length} rule(s) breached, Health_Thresholds ${d.rule.rule_id}`, m.model_id);
  }
  // 2 version volume change
  for (const m of ms.filter(m => m.prod && m.prod._i > 0)) {
    const pv = m.versions[m.prod._i - 1]; const a = +m.prod.training_records, b = +pv.training_records;
    if (b && Math.abs(a / b - 1) >= 0.1 && days(m.prod.train_date, ed) <= 240)
      push(-1, `<a data-go="model/${m.model_id}/versions">${esc(m.label)} v${m.prod.version}</a> was retrained using <b>${F.pct(Math.abs(a / b - 1), 0)} ${a > b ? 'more' : 'fewer'}</b> training records than v${pv.version} (${F.big(b)} → ${F.big(a)}).`, `Model_Version_History, trained ${F.date(m.prod.train_date)}`, m.model_id);
  }
  // 3 segment staleness
  const segs = groupBy(ms.filter(m => m.isProd), m => m.segment_id);
  for (const [sid, arr] of Object.entries(segs)) {
    const lt = arr.map(lastTrain).sort().pop(); const mo = Math.floor(days(lt, ed) / 30.4);
    if (mo >= 6) push(1, `<b>${esc(arr[0].client.short)} ${esc(arr[0].seg.segment_name)}</b> has not undergone retraining in the last ${mo} months (${arr.length} production model${arr.length > 1 ? 's' : ''}; most recent ${F.date(lt)}).`, 'Model_Version_History.train_date', null);
  }
  // 4 declining recall
  const tp = cfgVal('trend_periods', 3);
  for (const m of ms.filter(m => m.isProd)) { const r = m.health.rules.find(x => x.rule.signal === 'recall_decline_periods'); if (r && r.value >= tp) push(1, `<a data-go="model/${m.model_id}/performance">${esc(m.label)}</a> shows declining recall over the last ${r.value} reporting periods (${esc(r.extra)}).`, 'Model_Performance_Metrics, matured labels only', m.model_id); }
  // 5 coverage
  const ac = uniq(ms.map(m => m.client_id)); if (ac.length > 1) {
    const cov = M.programs.map(p => ({ p, n: uniq(ms.filter(m => m.isProd && m.program_id === p.program_id).map(m => m.client_id)).length })).sort(by('n'));
    if (cov.length && cov[0].n < cov[cov.length - 1].n) push(0, `<b>${esc(cov[0].p.program_name)}</b> models have the lowest portfolio coverage — in production for ${cov[0].n} of ${ac.length} active clients (vs ${cov[cov.length - 1].n} for ${esc(cov[cov.length - 1].p.program_name)}).`, 'Model_Master × Client_Master', null);
  }
  // 6 rollbacks
  for (const m of ms) for (const e of m.events.filter(e => /rollback/i.test(e.event_type) && days(e.event_date, ed) >= 0 && days(e.event_date, ed) <= 365)) push(1, `<a data-go="model/${m.model_id}/versions">${esc(m.label)}</a> v${e.version} was rolled back on ${F.date(e.event_date)} — ${esc(e.notes || '')}.`, 'Model_Deployment_History', m.model_id);
  // 7 attribution gap
  const un = ms.filter(m => m.isProd && m.recovery_attribution === 'Not attributable');
  if (un.length) { const v = sum(un.map(m => bizAgg(m.impact.filter(inRange)).validated)); push(0, `${un.length} production model${un.length > 1 ? 's have' : ' has'} no recovery attribution; <b>${F.usd(v)}</b> validated overpayment in the period is excluded from recovery totals.`, 'Model_Master.recovery_attribution', null); }
  // 8 pipeline
  const pend = ms.filter(m => m.sched.pending_deployment === 'Y'); if (pend.length) push(0, `${pend.length} model${pend.length > 1 ? 's are' : ' is'} validated and awaiting production deployment: ${pend.map(m => `<a data-go="model/${m.model_id}">${esc(m.label)}</a>`).join(', ')}.`, 'Model_Retraining_Schedule.pending_deployment', null);
  // 9 business trend QoQ
  const q = uniq(ms.flatMap(m => m.impact).filter(r => r.period <= S.to).map(r => quarterOf(r.period))).sort();
  if (q.length >= 3) { const qq = q.slice(-3, -1); const v = qq.map(k => sum(ms.flatMap(m => m.impact).filter(r => quarterOf(r.period) === k).map(r => r.validated_overpayment))); if (v[0]) push(-1, `Validated overpayment ${v[1] >= v[0] ? 'rose' : 'fell'} <b>${F.pct(Math.abs(v[1] / v[0] - 1))}</b> in ${qq[1]} vs ${qq[0]} (${F.usd(v[0])} → ${F.usd(v[1])}).`, 'Model_Business_Impact, last two complete quarters', null); }
  // 10 efficient performers
  for (const x of portfolioIntel(ms).filter(x => x.type === 'Efficient performer').slice(0, 1)) push(-1, esc(x.text).replace(esc(x.m.label), `<a data-go="model/${x.m.model_id}">${esc(x.m.label)}</a>`), 'Portfolio Intelligence', x.m.model_id);
  return out.sort((a, b) => b.sev - a.sev);
}

const ALL_TOKENS = TOKEN_GROUPS.flatMap(g => g[1].map(t => t[0]));

VIEWS.calendar = () => {
  const ms = fModels(); const ed = evalDate(); const win = cfgVal('approaching_window_days', 45);
  const dTo = d => d ? days(isoD(ed), d) : null;
  const overdue = ms.filter(m => m.isProd && ((dTo(m.sched.planned_retrain_date) ?? 1) < 0 || (stalenessRatio(m) ?? 0) >= 1));
  const appr = ms.filter(m => m.isProd && !overdue.includes(m) && dTo(m.sched.planned_retrain_date) != null && dTo(m.sched.planned_retrain_date) <= win);
  const awaitV = ms.filter(m => m.sched.awaiting_validation === 'Y' || (m.lifecycle_stage === 'Validation' && m.sched.pending_deployment !== 'Y'));
  const pend = ms.filter(m => m.sched.pending_deployment === 'Y');
  const list = (t, arr, f, c) => `<div class="panel"><div class="ph"><h3 style="color:${c}">${t}</h3><span class="r num" style="font-size:18px;color:${c}">${arr.length}</span></div>${arr.map(m => `<div class="li" data-go="model/${m.model_id}/versions"><span>${esc(m.label)}</span><span class="dim mono">${f(m)}</span></div>`).join('') || '<div class="dim">None</div>'}</div>`;
  const radarCards = ms.filter(m => m.isProd).map(m => ({ m, r: radarSignals(m) })).sort((a, b) => b.r.score - a.r.score);
  return `<div class="vh"><div><h2>Retraining &amp; Lifecycle Calendar</h2><p>Retraining windows, validations, releases and model reviews. Filter by client, program and owner using the bar above.</p></div></div>
  <div class="lists">${list('Overdue for retraining', overdue, m => (dTo(m.sched.planned_retrain_date) < 0 ? -dTo(m.sched.planned_retrain_date) + 'd late' : Math.round(stalenessRatio(m) * 100) + '% cadence'), 'var(--att)')}${list(`Approaching window, ${win}d`, appr, m => 'in ' + dTo(m.sched.planned_retrain_date) + 'd', 'var(--mon)')}${list('Awaiting validation', awaitV, m => F.date(m.sched.next_validation_date), 'var(--s2)')}${list('Pending production deployment', pend, m => 'v' + m.current_version, 'var(--accent)')}</div>
  <div class="panel" style="margin-top:14px"><div class="ph"><h3>Lifecycle timeline</h3><span class="sub">bar = last training → planned retraining</span><div class="r legend"><span><span class="dot bg-0"></span>within cadence</span><span><span class="dot bg-1"></span>approaching</span><span><span class="dot bg-2"></span>overdue</span><span>◆ validation</span><span>▲ release</span><span>✕ rollback</span><span>○ review</span></div></div>${gantt(ms)}</div>
  <div class="grid g-64" style="margin-top:14px"><div class="panel"><div class="ph"><h3>Calendar</h3><div class="r"><button class="btn sm" data-cal="-1">‹</button><b style="min-width:90px;text-align:center">${F.mon(S.calMonth || perOf(ed))}</b><button class="btn sm" data-cal="1">›</button></div></div>${monthGrid(ms)}</div>
  <div class="panel"><div class="ph"><h3>Retraining opportunity radar</h3><span class="sub">ranked by composite signal</span></div><div style="display:grid;gap:10px">${radarCards.slice(0, 4).map(({ m, r }) => `<div class="rcard" data-go="model/${m.model_id}"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:500">${esc(m.label)}</b><span class="num ${r.score > .5 ? 's-2' : r.score > .3 ? 's-1' : 's-0'}">${Math.round(r.score * 100)}</span></div><div style="display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center">${radar(r.sig, { size: 150, color: r.score > .5 ? 'var(--att)' : r.score > .3 ? 'var(--mon)' : 'var(--ok)' })}<ul class="why-list">${r.reasons.map(x => `<li>${esc(x.why)}</li>`).join('') || '<li>No retraining trigger reached</li>'}</ul></div></div>`).join('')}</div>
   <div class="explain">Signals (each scaled 0–1): data age vs cadence, new claims since training vs training size, unseen-code rate, performance decline, feature PSI, score-distribution PSI.</div></div></div>`;
};
function gantt(ms) {
  const ed = evalDate(); const start = new Date(ed.getFullYear(), ed.getMonth() - 12, 1), end = new Date(ed.getFullYear(), ed.getMonth() + 7, 1);
  const rows = ms.slice().sort(by(m => m.sched.planned_retrain_date || '9999'));
  const w = 980, L = 210, R = 10, rh = 24, h = rows.length * rh + 30;
  const X = d => L + clamp((toDate(d) - start) / (end - start), 0, 1) * (w - L - R);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;min-width:720px">`;
  for (let k = 0; k <= 19; k++) { const d = new Date(start.getFullYear(), start.getMonth() + k, 1); s += `<line x1="${X(isoD(d))}" x2="${X(isoD(d))}" y1="0" y2="${h - 20}" stroke="var(--line)" opacity=".6"/>${k % 2 === 0 ? `<text x="${X(isoD(d)) + 2}" y="${h - 6}" font-size="10" fill="var(--dim)">${F.mon(perOf(d))}</text>` : ''}`; }
  s += `<line x1="${X(isoD(ed))}" x2="${X(isoD(ed))}" y1="0" y2="${h - 20}" stroke="var(--accent)" stroke-width="1.5"/><text x="${X(isoD(ed)) + 4}" y="10" font-size="10" fill="var(--accent)">as of</text>`;
  rows.forEach((m, i) => {
    const y = i * rh + 14; const lt = lastTrain(m), pr = m.sched.planned_retrain_date;
    s += `<text x="0" y="${y + 4}" font-size="11" fill="var(--muted)" style="cursor:pointer" data-go="model/${m.model_id}/versions">${esc(m.label.length > 34 ? m.label.slice(0, 33) + '…' : m.label)}</text>`;
    if (lt && pr) {
      const od = toDate(pr) < ed; const ap = !od && days(isoD(ed), pr) <= cfgVal('approaching_window_days', 45);
      const col = od ? 'var(--att)' : ap ? 'var(--mon)' : 'var(--ok)';
      s += `<rect x="${X(lt)}" y="${y - 5}" width="${Math.max(2, X(pr) - X(lt))}" height="10" rx="3" fill="${col}" fill-opacity=".35" stroke="${col}" data-tip="<b>${esc(m.label)}</b><br>Last trained ${F.date(lt)}<br>Planned retrain ${F.date(pr)}"/>`;
      if (od) s += `<rect x="${X(pr)}" y="${y - 2}" width="${Math.max(0, X(isoD(ed)) - X(pr))}" height="4" fill="var(--att)" data-tip="Overdue by ${days(pr, isoD(ed))} days"/>`;
    }
    for (const e of m.events) { const d = toDate(e.event_date); if (d < start || d > end) continue; const x = X(e.event_date);
      if (/validation/i.test(e.event_type)) s += `<path d="M${x} ${y - 5}l5 5-5 5-5-5z" fill="var(--s2)" data-tip="${F.date(e.event_date)}, validation v${esc(e.version)}, ${esc(e.outcome)}"/>`;
      else if (/deploy/i.test(e.event_type) && /prod/i.test(e.environment)) s += `<path d="M${x} ${y - 6}l5 9h-10z" fill="var(--text)" data-tip="${F.date(e.event_date)}, v${esc(e.version)} released"/>`;
      else if (/rollback/i.test(e.event_type)) s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="13" fill="var(--crit)" data-tip="${F.date(e.event_date)}, rollback v${esc(e.version)}">✕</text>`; }
    if (m.sched.next_model_review) s += `<circle cx="${X(m.sched.next_model_review)}" cy="${y}" r="4" fill="none" stroke="var(--muted)" data-tip="Model review ${F.date(m.sched.next_model_review)}"/>`;
    if (m.sched.next_validation_date && toDate(m.sched.next_validation_date) <= end) s += `<path d="M${X(m.sched.next_validation_date)} ${y - 5}l5 5-5 5-5-5z" fill="none" stroke="var(--s2)" data-tip="Next validation ${F.date(m.sched.next_validation_date)}"/>`;
  });
  return `<div class="scroll">${s}</svg></div>`;
}
function monthGrid(ms) {
  const cm = S.calMonth || perOf(evalDate()); const [y, mo] = cm.split('-').map(Number);
  const first = new Date(y, mo - 1, 1); const startDow = (first.getDay() + 6) % 7; const nd = new Date(y, mo, 0).getDate();
  const evs = [];
  for (const m of ms) {
    for (const e of m.events) evs.push({ d: e.event_date, t: e.event_type, m, c: (EVT[e.event_type] || {}).c || 'var(--dim)', l: `${e.event_type} v${e.version}` });
    const sc = m.sched; [['planned_retrain_date', 'Planned retrain', 'var(--mon)'], ['next_validation_date', 'Validation due', 'var(--s2)'], ['next_model_review', 'Model review', 'var(--muted)']].forEach(([k, l, c]) => sc[k] && evs.push({ d: sc[k], t: l, m, c, l }));
  }
  const today = isoD(evalDate());
  let h = `<div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dh">${d}</div>`).join('')}`;
  for (let i = 0; i < startDow; i++) h += `<div class="out"></div>`;
  for (let d = 1; d <= nd; d++) {
    const ds = `${cm}-${String(d).padStart(2, '0')}`; const de = evs.filter(e => e.d === ds);
    h += `<div class="${ds === today ? 'today' : ''}"><div class="dn">${d}</div>${de.map(e => `<span class="ev" style="border-left-color:${e.c}" data-go="model/${e.m.model_id}/versions" data-tip="<b>${esc(e.m.label)}</b><br>${esc(e.l)}">${esc(e.m.client.short)} ${esc(e.m.program.program_name)}, ${esc(e.t)}</span>`).join('')}</div>`;
  }
  const tail = (7 - (startDow + nd) % 7) % 7; for (let i = 0; i < tail; i++) h += `<div class="out"></div>`;
  return h + '</div>';
}

/* ===================== MODULE F — Compare & Portfolio Intelligence ===================== */
function presets() {
  const f = (cli, seg, prog) => M.models.find(m => m.client.short.toLowerCase() === cli && (!seg || m.seg.segment_name.toLowerCase() === seg) && m.program.program_name.toLowerCase() === prog);
  const P = [
    ['Humana Postpay vs UHC COSMOS, DRG Coding', [f('humana', 'postpay', 'drg coding'), f('uhc', 'cosmos', 'drg coding')]],
    ['Humana Prepay vs Postpay, DRG Coding', [f('humana', 'prepay', 'drg coding'), f('humana', 'postpay', 'drg coding')]],
    ['Aetna HRP vs ACAS, APC', [f('aetna', 'hrp', 'apc'), f('aetna', 'acas', 'apc')]],
    ['DRG Coding vs DRG CVA, Humana Postpay', [f('humana', 'postpay', 'drg coding'), f('humana', 'postpay', 'drg cva')]],
    ['DRG vs APC vs Readmission', [f('humana', 'postpay', 'drg coding'), f('humana', 'postpay', 'apc'), f('uhc', 'unet', 'readmission')]],
  ];
  return P.map(([l, a]) => [l, a.filter(Boolean).map(m => m.model_id)]).filter(p => p[1].length >= 2);
}
function comparability(def, ms) {
  const c = String(def.comparability || 'Within program');
  if (/not comparable/i.test(c)) return { ok: false, why: 'Context only — scale-dependent, never ranked' };
  if (/universal/i.test(c)) return { ok: true, why: 'Comparable across all models' };
  const sameP = uniq(ms.map(m => m.program_id)).length === 1, sameT = uniq(ms.map(m => m.ptype)).length === 1;
  if (/payment/i.test(c)) return sameP && sameT ? { ok: true, why: 'Same program & payment type' } : { ok: false, why: 'Requires same program and payment type' };
  return sameP ? { ok: true, why: 'Same program' } : { ok: false, why: 'Different programs — definitions & prevalence differ' };
}
VIEWS.compare = () => {
  const pr = presets();

    { label: 'Current production version', f: m => m.production_version ? 'v' + m.production_version : '—' },

  ];
  const rows = defs.map(d => {
    const c = comparability(d, ms); const vals = ms.map(m => metricApplies(d, m) ? metricVal(m, d.metric_key) : undefined);
    const okv = vals.filter(v => v != null && isFinite(v)); const mx = Math.max(...okv.map(Math.abs), 0) || 1;
    const hb = String(d.higher_is_better).toUpperCase() !== 'N';

      ${vals.map(v => v === undefined ? `<td class="nc">n/a for program</td>` : `<td class="num">${v === best ? '<b>' : ''}${F.by(d.format, v)}${v === best ? '</b>' : ''}${c.ok && v != null ? `<div class="cbar" style="width:${Math.abs(v) / mx * 100}%;opacity:${v === best ? 1 : .45}"></div>` : ''}</td>`).join('')}</tr>`;
  }).join('');

  return `<div class="vh"><div><h2>Cross-Client Model Comparison</h2><p>Side-by-side comparison with explicit comparability rules from <code>Metric_Definitions</code>. Metrics are only visually compared when their definitions make the comparison fair — there is no single universal ranking.</p></div></div>

    <div class="pick">${ms.map(m => `<span class="pchip" style="--band:${m.program.color}"><span class="dot" style="background:${m.program.color}"></span>${esc(m.label)}<button data-rmcmp="${m.model_id}">✕</button></span>`).join('')}</div>

  ${ms.length ? `<div class="panel flush" style="margin-top:14px"><div class="scroll"><table class="tbl cmp"><thead><tr><th style="width:200px">Metric</th>${ms.map(m => `<th style="color:var(--text);font-size:12.5px;white-space:normal"><a data-go="model/${m.model_id}" style="color:var(--text)">${esc(m.label)}</a><div class="dim mono" style="font-size:10.5px">${esc(m.ptype)}</div></th>`).join('')}</tr></thead><tbody>

    <div class="explain" style="margin:10px 16px 14px">Bold + full bar = best among comparable values for that metric only. Business metrics use ${F.mon(S.from)} – ${F.mon(S.to)}; technical metrics use the latest matured production period.</div></div>` : ''}

  <div class="grid g3">${['Large training set', 'Efficient performer', 'Declining performance', 'Outdated training data', 'Limited coverage', 'Standardization opportunity'].map(t => `<div class="panel"><div class="ph"><h3>${t}</h3><span class="r num dim">${(piG[t] || []).length}</span></div>${(piG[t] || []).map(x => `<div class="ins" ${x.m ? `data-go="model/${x.m.model_id}" style="cursor:pointer"` : ''}><div>${esc(x.text)}</div></div>`).join('') || '<div class="dim">Nothing detected</div>'}</div>`).join('')}</div>`;

/* ===================== loading ===================== */
async function readFile(f) {
  const n = f.name.toLowerCase();
  if (n.endsWith('.json')) { const j = JSON.parse(await f.text()); return { full: true, tables: j.tables || j }; }
  if (typeof XLSX === 'undefined') throw new Error('Spreadsheet parser unavailable in this browser — load JSON instead.');
  if (n.endsWith('.csv')) { const wb = XLSX.read(await f.text(), { type: 'string', cellDates: true, raw: false }); const ws = wb.Sheets[wb.SheetNames[0]]; return { full: false, tables: { [f.name.replace(/\.csv$/i, '')]: XLSX.utils.sheet_to_json(ws, { defval: '' }) } }; }
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
  const tables = {}; for (const s of wb.SheetNames) tables[s] = XLSX.utils.sheet_to_json(wb.Sheets[s], { defval: '', raw: true });
  return { full: true, tables };
}
async function handleFiles(files) {
  if (!files.length) return;
  try {
    let raw = {}, full = false;
    for (const f of files) { const r = await readFile(f); full = full || r.full; Object.assign(raw, r.tables); }
    if (isSimpleWorkbook(raw)) { const min = simpleFromRaw(raw); const name = files.map(f => f.name).join(', '); loadSimple(min, name); const e = DB.build.issues.list.filter(x => x.lvl === 'error').length; toast(`Loaded ${name}: ${M.models.length} models from ${min.Models.length} version rows${e ? `, ${e} cell${e > 1 ? 's' : ''} need fixing on Data entry` : ''}`); return; }
    const norm = normalizeTables(raw);
    const base = full ? {} : DB.tables;
    for (const t of Object.keys(SCHEMA)) {
      if (!norm[t].length) norm[t] = base[t] && base[t].length ? base[t] : (['Config', 'Health_Thresholds', 'Metric_Definitions'].includes(t) ? EMBEDDED_N[t] : []);
    }
    const iss = validate(norm);
    const errs = iss.filter(i => i.lvl === 'error');
    if (errs.length) { DB.issues = iss; go('studio'); render(); toast(`Not loaded: ${errs.length} error(s) — see validation report`); return; }
    const name = files.map(f => f.name).join(', ');
    loadTables(norm, name, true, iss);
    toast(`Loaded ${name}: ${norm.Model_Master.length} models, ${norm.Model_Version_History.length} versions`);
  } catch (err) { console.error(err); toast('Could not read file: ' + err.message); }
}
let EMBEDDED_N;
function loadTables(tables, source, persist, iss) {

  if (od.length) out.push({ sev: 2, text: `${od.length} follow-up action${od.length > 1 ? 's are' : ' is'} overdue: ${od.slice(0, 3).map(a => `<a data-go="model/${a.model_id}/health">${esc((M.byId[a.model_id] || {}).label || a.model_id)}</a> (${esc(a.owner)})`).join(', ')}.`, why: 'Actions sheet, due dates', mid: null });
  const noAct = ms.filter(m => m.isProd && m.health.status >= 2 && !openActs(m).length);
  if (noAct.length) out.push({ sev: 1, text: `${noAct.length} model${noAct.length > 1 ? 's' : ''} needing attention ${noAct.length > 1 ? 'have' : 'has'} no follow-up action: ${noAct.map(m => `<a data-go="model/${m.model_id}/health">${esc(m.label)}</a>`).join(', ')}.`, why: 'Health status × Actions sheet', mid: null });
  for (const f of ms.flatMap(forecasts).sort(by('mths')).slice(0, 2)) out.push({ sev: 1, text: `<a data-go="model/${f.m.model_id}/health">${esc(f.m.label)}</a>: ${esc(lc(f.label))} reaches ${esc(f.what)} ${monthsTxt(f.mths)} at the current trend.`, why: `Linear trend over the last ${f.pts.length} months`, mid: f.m.model_id });
  return out.sort((a, b) => b.sev - a.sev);
};
const _port0 = VIEWS.portfolio;
VIEWS.portfolio = () => {
  const h = _port0(); if (!M.models.length) return h;
  const base = addMonths(S.to, -1), H0 = healthAt(base), prod = fModels({ ignoreStage: true }).filter(m => m.isProd);
  const up = prod.filter(m => H0[m.model_id] && m.health.status > H0[m.model_id].status).length, dn = prod.filter(m => H0[m.model_id] && m.health.status < H0[m.model_id].status).length;
  const rel = prod.flatMap(m => m.events).filter(e => e.event_type === 'Deployment' && e.event_date > isoD(periodEnd(base)) && e.event_date <= isoD(evalDate())).length;

};
const _model0 = VIEWS.model;
VIEWS.model = () => { const h = _model0(); const id = lastModel; return h.replace(`<button class="btn sm" data-addcmp="${id}">`, `<button class="btn sm" data-go="card/${id}">Model card</button><button class="btn sm" data-addcmp="${id}">`); };

/* ---------- threshold preview ---------- */
function thrPreviewHtml() {
  const base = thresholds(); const draft = base.map(r => { const tr = $(`#drawer tr[data-rule="${CSS.escape(r.rule_id)}"]`); if (!tr) return r; const o = { ...r }; $$('input', tr).forEach(i => { o[i.dataset.k] = i.type === 'checkbox' ? (i.checked ? 'Y' : 'N') : (i.value === '' ? '' : +i.value); }); return o; });
  const ch = M.models.filter(m => m.isProd).map(m => ({ m, a: m.health.status, b: computeHealth(m, draft).status })).filter(x => x.a !== x.b);
  const cnt = (k) => [0, 1, 2, 3].map(s => M.models.filter(m => m.isProd).filter(m => (k === 'a' ? m.health.status : computeHealth(m, draft).status) === s).length);
  const A = cnt('a'), B = cnt('b');
  return `<div class="ph" style="margin:0 0 6px"><h3>Effect of these settings</h3></div><div class="legend" style="margin-bottom:6px">${[0, 1, 2, 3].map(s => `<span><span class="dot bg-${s}"></span>${STATUS[s]} ${A[s]}${A[s] !== B[s] ? ` → <b>${B[s]}</b>` : ''}</span>`).join('')}</div>${ch.length ? ch.map(x => `<div style="font-size:13px;padding:2px 0">${esc(x.m.label)}: <span class="s-${x.a}">${STATUS[x.a]}</span> → <span class="s-${x.b}">${STATUS[x.b]}</span></div>`).join('') : '<div class="dim" style="font-size:13px">No model would change status.</div>'}`;
}
const _thrEd0 = thresholdEditor;
thresholdEditor = function () { _thrEd0(); $('#drawer').insertAdjacentHTML('beforeend', `<div id="thrPreview" class="panel" style="margin-top:14px">${thrPreviewHtml()}</div>`); };

/* ---------- printable executive brief ---------- */
function printBar(title) { return `<div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;align-items:center"><button class="btn pri" data-print>Print or save as PDF</button><span class="dim" style="font-size:13px">${title}</span></div>`; }
VIEWS.brief = () => {
  const all = fModels({ ignoreStage: true }); if (!all.length) return '<div class="empty">No models.</div>';
  const ps = portfolioScore(all), prod = all.filter(m => m.isProd), att = prod.filter(m => m.health.status >= 2).sort((a, b) => b.health.status - a.health.status), monL = prod.filter(m => m.health.status === 1);
  const b = bizAgg(all.flatMap(m => m.impact.filter(inRange)));
  const base = addMonths(S.to, -1), H0 = healthAt(base);
  const up = prod.filter(m => H0[m.model_id] && m.health.status > H0[m.model_id].status), dn = prod.filter(m => H0[m.model_id] && m.health.status < H0[m.model_id].status);
  const rel = all.flatMap(m => m.events.map(e => ({ ...e, m }))).filter(e => /Deployment|Rollback/.test(e.event_type) && e.event_date > isoD(periodEnd(base)) && e.event_date <= isoD(evalDate()));
  const fc = prod.flatMap(forecasts).sort(by('mths')).slice(0, 4);
  const syn = String(cfgVal('data_classification', '')).toUpperCase() === 'SYNTHETIC';
  const filt = [S.client && M.clients[S.client]?.short, S.segment && M.segments[S.segment]?.segment_name, S.program && M.progById[S.program]?.program_name, S.ptype].filter(Boolean).join(', ');
  const col = ps ? (ps.score >= 85 ? 'var(--ok)' : ps.score >= 70 ? 'var(--mon)' : ps.score >= 55 ? 'var(--att)' : 'var(--crit)') : 'var(--dim)';
  return `<div class="brief">${printBar('One page, A4. Uses the filters and period currently selected.')}
  <div class="bh"><div><h2>ML model portfolio brief</h2><p class="muted" style="margin:4px 0 0">${esc(cfgVal('org_name', ''))}${cfgVal('org_name', '') ? ', ' : ''}as of ${F.date(isoD(evalDate()))}${filt ? `. Scope: ${esc(filt)}` : '. All clients and programs'}. Business figures ${F.mon(S.from)} to ${F.mon(S.to)}.</p>${syn ? '<p class="s-2" style="margin:4px 0 0;font-size:13px">Synthetic, illustrative data. Not actual client results.</p>' : ''}</div></div>
  <div class="grid g3" style="margin-top:12px">
    <div class="panel"><div class="ph"><h3>Portfolio health</h3></div>${ps ? `<div style="display:flex;gap:14px;align-items:center">${ring(ps.score / 100, { size: 96, stroke: 8, color: col, label: Math.round(ps.score), sub: 'of 100' })}<div style="font-size:12.5px;flex:1">${ps.comps.map(c => `<div style="display:flex;justify-content:space-between;gap:6px"><span class="muted">${c.k}</span><b class="num">${Math.round(c.v * 100)}</b></div>`).join('')}</div></div>` : '<div class="dim">No production models</div>'}</div>
    <div class="panel"><div class="ph"><h3>Portfolio</h3></div><div class="ekv">${[[all.length, 'Models'], [prod.length, 'In production'], [all.filter(m => m.lifecycle_stage === 'Validation').length, 'In validation'], [att.filter(m => m.health.status >= 2).length, 'Need attention'], [prod.filter(m => (stalenessRatio(m) ?? 0) >= 1).length, 'Retrain overdue'], [uniq(all.map(m => m.client_id)).length, 'Clients']].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>
    <div class="panel"><div class="ph"><h3>Business</h3></div><div class="ekv">${[[F.usd(b.validated), 'Validated'], [F.usd(b.recovered), 'Realized'], [F.int(b.findings), 'Findings'], [F.pct(b.hitrate), 'Hit rate'], [F.pct(b.sme), 'SME conv.'], [F.usd0(b.dpf), '$ per find']].map(([v, l]) => `<div><b style="font-size:20px">${v}</b><span>${l}</span></div>`).join('')}</div></div>
  </div>
  <div class="panel" style="margin-top:12px"><div class="ph"><h3>Since ${F.mon(base)}</h3></div><ul class="why-list" style="font-size:13.5px;color:var(--text)">
    <li>${up.length} model${up.length === 1 ? '' : 's'} got worse${up.length ? ': ' + up.map(m => `${esc(m.label)} (${STATUS[H0[m.model_id].status]} to ${STATUS[m.health.status]})`).join('; ') : ''}.</li>
    <li>${dn.length} improved${dn.length ? ': ' + dn.map(m => esc(m.label)).join('; ') : ''}.</li>
    <li>${rel.length ? rel.map(e => `${esc(e.m.label)} v${esc(e.version)} ${e.event_type === 'Rollback' ? 'rolled back' : 'released'} ${F.date(e.event_date)}`).join('; ') : 'No releases or rollbacks'}.</li></ul></div>
  <div class="panel" style="margin-top:12px"><div class="ph"><h3>Models needing attention</h3><span class="sub">Attention required or critical</span></div>${att.length ? `<table class="tbl"><thead><tr><th>Model</th><th>Status</th><th>Main reason</th><th>Follow-up</th></tr></thead><tbody>${att.map(m => { const a = openActs(m)[0]; const d = m.health.drivers[0]; return `<tr><td>${esc(m.label)} <span class="dim">v${esc(m.production_version)}</span></td><td>${statusPill(m.health)}</td><td class="muted">${esc(d.rule.rule_name)}: ${esc(d.extra || F.by(d.rule.unit, d.value))}</td><td>${a ? `${esc(a.owner)}, <span class="${actState(a).s === 3 ? 's-3' : 'muted'}">${actState(a).t.toLowerCase()}</span>` : '<span class="s-1">No action yet</span>'}</td></tr>`; }).join('')}</tbody></table>` : '<div class="dim">No model needs attention.</div>'}${monL.length ? `<div style="font-size:12.5px;margin-top:6px" class="muted">Also on Monitor (${monL.length}): ${monL.map(m => `${esc(m.label)} (${esc(m.health.drivers[0].rule.rule_name.toLowerCase())})`).join('; ')}.</div>` : ''}</div>
  <div class="grid g2" style="margin-top:12px">
    <div class="panel"><div class="ph"><h3>Early warnings</h3></div>${fc.map(f => `<div style="font-size:13px;padding:3px 0">${esc(f.m.label)}: ${esc(lc(f.label))} reaches ${esc(f.what)} ${monthsTxt(f.mths)}.</div>`).join('') || '<div class="dim" style="font-size:13px">None projected within 6 months.</div>'}</div>
    <div class="panel"><div class="ph"><h3>Key observations</h3></div>${insights(all).filter(x => x.sev <= 1).slice(0, 4).map(x => `<div style="font-size:13px;padding:3px 0">${x.text.replace(/<a [^>]*>|<\/a>/g, '')}</div>`).join('')}</div>
  </div>
  <div class="dim" style="font-size:11.5px;margin-top:10px">Generated ${new Date().toLocaleString()} from ${esc(DB.source)}. Health rules and thresholds: see Health & Monitoring.</div></div>`;
};
VIEWS.card = () => {

  return `<div class="brief">${printBar('One page per model, for model-risk and validation reviews.')}
  <div class="bh" style="display:flex;gap:18px;align-items:center">${dnaGlyph(m, 120)}<div style="flex:1"><div class="dim" style="font-family:var(--cond);font-size:15px">${esc(m.model_id)}</div><h2>${esc(m.model_name)}</h2><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${statusPill(m.health)}<span class="tag">${esc(m.lifecycle_stage)}</span>${m.environment !== m.lifecycle_stage ? `<span class="tag">${esc(m.environment)}</span>` : ''}${m.production_version ? `<span class="tag">live version v${esc(m.production_version)}</span>` : ''}</div></div></div>
  <div class="panel" style="margin-top:12px">${kv([['Client', esc(m.client.client_name)], ['Segment', esc(m.seg.segment_name)], ['Payment type', esc(m.ptype)], ['Program', esc(m.program.program_name)], ['Owner', esc(m.ds_owner)], ['Algorithm', esc(m.algorithm)], ['Last trained', F.date(lastTrain(m))], ['Next retraining', F.date(m.sched.planned_retrain_date)], ['Cadence', (m.retrain_cadence_days || '—') + ' days'], ['Previous production', m.previous_production_version ? 'v' + esc(m.previous_production_version) : ''], ['Precision floor', F.pct(m.approved_min_precision, 0)], ['Recovery attribution', esc(m.recovery_attribution)]])}</div>
  <div class="panel" style="margin-top:12px"><div class="ph"><h3>Versions</h3></div><table class="tbl"><thead><tr><th>Version</th><th>Trained</th><th class="r">Records</th><th class="r">Positives</th><th class="r">Precision</th><th class="r">Recall</th><th class="r">${PM_LABEL[pmOf(m)]}</th><th>Status</th><th>Deployed</th></tr></thead><tbody>${m.versions.map(x => `<tr><td>v${esc(x.version)}</td><td>${F.date(x.train_date)}</td><td class="r">${F.int(x.training_records)}</td><td class="r">${F.int(x.positive_cases)}</td><td class="r">${F.pct(x.precision)}</td><td class="r">${F.pct(x.recall)}</td><td class="r">${F.n3(x[pmOf(m)])}</td><td>${esc(x.deployment_status)}</td><td>${F.date(x.deployment_date)}</td></tr>`).join('')}</tbody></table></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="panel"><div class="ph"><h3>Production performance, 12 months</h3></div>${m.perf.length ? lineChart({ xs, series: [{ name: 'Precision', color: 'var(--s2)', vals: xs.map(p => pr(p)?.precision ?? null) }, { name: 'Recall', color: 'var(--accent)', vals: xs.map(p => pr(p)?.recall ?? null) }], fmt: x => F.pct(x, 0), h: 150, w: 420, refs: m.approved_min_precision ? [{ v: +m.approved_min_precision, label: 'floor' }] : [] }) : '<div class="dim">No production performance recorded.</div>'}
      <div style="font-size:12.5px" class="muted">Hit rate ${F.pct(b.hitrate)}, SME conversion ${F.pct(b.sme)}, $ per find ${F.usd0(b.dpf)}, validated ${F.usd(b.validated)} (${F.mon(S.from)}–${F.mon(S.to)}).</div></div>

};

/* ---------- events ---------- */
function bindMore() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-back],[data-print],[data-saveaction]'); if (!t) return;
    if (t.dataset.back) { S.back = +t.dataset.back; render(); return; }
    if (t.dataset.print !== undefined) { window.print(); return; }
    if (t.dataset.saveaction) {
      const id = t.dataset.saveaction, act = $('#acText').value.trim(), owner = $('#acOwner').value.trim();
      if (!act || !owner) { toast('Add the action and an owner'); return; }
      (DB.min.Actions = DB.min.Actions || []).push({ model: id, issue: $('#acIssue').value.trim(), action: act, owner, due_date: $('#acDue').value, status: 'Open', opened_on: todayISO() });
      rebuildSimple(); saveSimple(); const inDrawer = $('#drawer').classList.contains('open'); if (inDrawer) drawerModel(id); render(); toast('Action added');
    }
  });
  document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#drawer tr[data-rule]')) { const p = $('#thrPreview'); if (p) p.innerHTML = thrPreviewHtml(); } });
  document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#drawer tr[data-rule]')) { const p = $('#thrPreview'); if (p) p.innerHTML = thrPreviewHtml(); } });
}
